#
# Homebrew Publish (lane:brew) - update the tap's formula on every release.
#
# Mirrors winget-publish.yml: `workflow_dispatch` only, dispatched by
# release.yml once the GitHub Release exists; never `on: release`.
# Renders packaging/homebrew/md2html.rb with the release's asset URLs and
# SHA256s and pushes it to the tap repository named by the HOMEBREW_TAP
# variable (default <owner>/homebrew-md2html) with the HOMEBREW_TAP_TOKEN
# secret (a fine-grained PAT with contents: write on that one
# repository). Without the token it warns and skips.
#
# Dormant until the LANE_BREW repository variable is `true`
# (docs/forge/COMPONENTS.md, lane:brew).

name: Homebrew Publish

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Git tag to publish to the Homebrew tap (e.g. v0.1.2)'
        required: true
        type: string

concurrency:
  group: brew-publish-${{ inputs.release-tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Update the tap formula
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: vars.LANE_BREW == 'true' && github.repository_owner == 'githubrobbi'
    steps:
      - name: Check HOMEBREW_TAP_TOKEN is configured
        # LANE_BREW=true without the token is a half-enabled lane: fail with
        # the fix instead of skipping the tap update quietly.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error title=HOMEBREW_TAP_TOKEN missing::LANE_BREW is on but the HOMEBREW_TAP_TOKEN secret is not set - set it (docs/forge/COMPONENTS.md lane:brew), then re-run this workflow for ${TAG}."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render the formula from the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${RELEASE_REPO}/releases/download/${TAG}"
          sha_of() { gh release download "$TAG" --repo "$RELEASE_REPO" --pattern "$1" --output - | sha256sum | awk '{print $1}'; }
          ARM_SHA="$(sha_of md2html-macos-arm64.zip)"
          X64_SHA="$(sha_of md2html-macos-x64.zip)"
          LINUX_SHA="$(sha_of md2html-linux-x64.zip)"
          sed -e "s|@BASE@|${base}|g" \
              -e "s|@ARM_SHA@|${ARM_SHA}|g" -e "s|@X64_SHA@|${X64_SHA}|g" -e "s|@LINUX_SHA@|${LINUX_SHA}|g" \
              packaging/homebrew/md2html.rb > "$RUNNER_TEMP/md2html.rb"
          # A placeholder the substitution missed would publish a formula
          # that cannot install.
          if grep -n '@[A-Z_]*@' "$RUNNER_TEMP/md2html.rb"; then
            echo "::error title=Placeholder left::the rendered formula still holds a placeholder (above)"
            exit 1
          fi
          ruby -c "$RUNNER_TEMP/md2html.rb"
      - name: Homebrew's own style check of the formula
        # The runner image carries Homebrew; a formula its style check
        # refuses is not pushed to the tap.
        shell: bash
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew style "$RUNNER_TEMP/md2html.rb"
      - name: Push the formula to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-md2html', github.repository_owner) }}
          TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "$RUNNER_TEMP/md2html.rb" "$RUNNER_TEMP/tap/Formula/md2html.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "md2html-release"
          git config user.email "release@md2html.example"
          git add Formula/md2html.rb
          # An unchanged formula (a re-run for the same tag) is the one
          # case with nothing to commit; any other commit failure fails.
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "md2html ${TAG}"
          git push origin HEAD
