# SPDX-License-Identifier: MIT OR Apache-2.0
# Every pull request and every push to main: formatted, lint-clean, tested on macOS, Ubuntu and Windows with
# the pinned toolchain (rust-toolchain.toml), built on the oldest Rust promised
# (rust-version in Cargo.toml), the supply chain checked, the rendered pages
# audited for accessibility and clicked through in Chrome, and the books
# (--epub) passed by epubcheck.
#
# Actions are pinned to the commit of a release whose signature GitHub verified
# (docs/SUPPLY-CHAIN.md); the comment names the release.
name: ci
on:
  # Pushes to main and every pull request; a branch is checked once, as its
  # pull request, not twice.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check
      - name: Anti-pattern gate (no lint exception in any Rust file, no lossy decoding or discarded write in production code)
        # Once is enough: the gate reads the source, and it needs bash 4
        # (`mapfile`), which the macOS runner's own bash is not.
        if: runner.os == 'Linux'
        run: bash scripts/ci/anti_pattern_gate.sh
      - run: cargo clippy --release --all-targets
      - run: cargo test --release -- --nocapture
      - name: The README, the showcase, the capabilities page and its translations render with nothing to fix
        # The translations are checked too: an edit of docs/capabilities.md
        # makes each one stale until its source_sha256 is renewed, and
        # --check is what says so (AGENTS.md section 11).
        run: |
          cargo build --release
          ./target/release/md2html --check README.md docs/showcase.md docs/capabilities.md docs/capabilities.*.md
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 build --release
  supply-chain:
    # md2html has no crates; these gates keep it that way unless a crate is vetted in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.22.0 cargo-vet@0.10.3
      - run: cargo deny check
      - run: cargo vet --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: "The browser tools: lockfile, signatures, provenance, advisories"
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npm audit signatures
          npm audit --audit-level=low
  browser:
    # The rendered pages in Chrome: an accessibility audit (axe-core, WCAG 2.2 AA)
    # in both themes and at phone width, and a click through every control.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: rustup toolchain install
      - run: cargo build --release
      - run: ./target/release/md2html README.md docs/showcase.md docs/capabilities.md
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - run: node audit.js ../../README.html ../../docs/showcase.html ../../docs/capabilities.html
        working-directory: tests/browser
      - run: node interact.js ../../README.html ../../docs/showcase.html ../../docs/capabilities.html
        working-directory: tests/browser
      - run: node live.js
        working-directory: tests/browser
  epub:
    # The EPUBs of the README, the showcase, the capabilities page and its
    # translations (19 books) pass epubcheck, the W3C's validator, with no
    # error and no warning. epubcheck is the W3C's release, its SHA-256
    # recorded here (`just install-dev-tools` reads both lines), run with
    # the Java that setup-java installs.
    runs-on: ubuntu-latest
    env:
      EPUBCHECK_VERSION: 5.4.0
      EPUBCHECK_SHA256: 33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: epubcheck, the W3C release, checksum verified
        run: |
          zip="$RUNNER_TEMP/epubcheck-$EPUBCHECK_VERSION.zip"
          curl -fsSL --retry 5 --retry-delay 3 -o "$zip" \
            "https://github.com/w3c/epubcheck/releases/download/v$EPUBCHECK_VERSION/epubcheck-$EPUBCHECK_VERSION.zip"
          echo "$EPUBCHECK_SHA256  $zip" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP"
      - run: rustup toolchain install
      - run: cargo build --release
      - name: The 19 books pass epubcheck with no message
        run: bash scripts/ci/epubcheck_books.sh target/release/md2html target/epubcheck java -jar "$RUNNER_TEMP/epubcheck-$EPUBCHECK_VERSION/epubcheck.jar"
