#
# ─────────────────────────────────────────────────────────────────────────────
# Dependabot auto-merge - narrowly-scoped reviewer-time reclaim
#
# Enables GitHub's native "auto-merge" on a Dependabot PR if - and ONLY
# if - EVERY one of the following is true:
#
#   1. The PR author is `dependabot[bot]`.
#   2. `dependabot/fetch-metadata` reports
#        update-type = `version-update:semver-patch`
#      (patch-level bumps only - no minor, no major).
#   3. The change is NOT a security update that would need human
#      review for its advisory notes (severity `high` / `critical`).
#   4. The Actions review (the `actions-review` job below, which this
#      one needs) passed: the bump brings no new action and no action
#      pinned by anything but a full commit SHA.  A failed review leaves
#      the PR unarmed.
#   5. The `Dependabot Review / Cargo.lock crate-count delta` annotation
#      (emitted by dependabot-review.yml) did not flag unexpected
#      transitive fan-out.  Enforced implicitly: auto-merge waits on all
#      required status checks, so if `dependabot-review.yml` annotates a
#      warning the maintainer sees it BEFORE the merge proceeds, and
#      branch protection still requires their approval.
#   6. Every required branch-protection check (`cargo vet check
#      --locked`, `cargo-deny`, clippy, tests, doc-tests, file-size
#      policy) passes.  GitHub's auto-merge engine gates this
#      automatically.
#
# What this workflow DOES NOT do:
#
#   * It does NOT bypass review.  `main` branch protection still
#     requires a human approval.  If the repo's "allow Dependabot to
#     bypass required reviews" setting is off (default), a maintainer
#     still has to click Approve.  What this saves is the "merge when
#     green" clickwork - GitHub queues the merge and executes as soon
#     as checks pass AND reviews are satisfied.
#
#   * It does NOT touch minor / major bumps.  Those continue the
#     existing manual-review flow documented in
#     `docs/policies/dependency_policy.md`.
#
#   * It does NOT bypass `cargo vet check`.  If the bumped version is
#     not covered by an imported audit or an exemption, CI goes red
#     and auto-merge is blocked - exactly the same gate as a manual
#     Dependabot review.
#
# Policy rationale:
#
#   This change narrows (but does not abolish) the previous policy of
#   "every Dependabot PR is human-reviewed and human-merged."  Patch-
#   level bumps covered by the existing audit trail are the lowest-
#   risk, highest-volume category - they pile up without delivering
#   any net security signal that the automated gates have not already
#   checked.  Reclaiming the reviewer time for minor / major bumps is
#   a net-positive shift; see the supply-chain posture in
#   `docs/policies/dependency_policy.md`.
#
# ─── The Actions review ──────────────────────────────────────────────────
#
# The Cargo side has its own guard (`dependabot-review.yml`, which watches
# only `Cargo.toml` and `Cargo.lock`); the `actions-review` job covers the
# workflows and composite actions (`.github/workflows/**`,
# `.github/actions/**`) of every Dependabot PR.  It is a job of this
# workflow, not a workflow of its own, so no local reusable-workflow call
# is needed (zizmor wants one spelt `$/...`, which actionlint cannot
# read yet).
#
# Current checks (each one fails the review):
#
#   1. NEW third-party action introduced.  A plain SHA bump of an
#      already-trusted action (`actions/checkout@<old> → @<new>`) is
#      routine.  A `uses:` that names an action **not previously present
#      anywhere in the repo** is a brand-new trust dependency - worth a
#      human look to confirm the publisher is who we think it is
#      (typo-squat / look-alike-org defense), so it fails the review and
#      the PR waits for a person.
#
#   2. NON-SHA pin.  Our policy is to pin every action to a full 40-char
#      commit SHA (immutable), with the human-readable tag in a trailing
#      comment.  A `uses:` pinned to a tag/branch instead of a SHA is a
#      weaker supply-chain posture (a moved tag can swap the code under
#      us).  Any non-SHA pin after the bump fails the review.
#
# A failed review leaves the PR open and unarmed for a maintainer; a
# plain SHA bump of actions already in use passes.
#
# What this does NOT do:
#
#   • Audit the *contents* of an action.  Pinning + reviewer judgment is
#     the control; this just makes the two signals above impossible to
#     miss.
#
# Threat model it addresses:
#
#   • A bump PR that, beyond advancing a known action's SHA, also
#     introduces a new/renamed action reference (supply-chain pivot), or
#     downgrades a pin from an immutable SHA to a mutable tag.  Without
#     this guard, a tired reviewer sees "just a CI bump" and rubber-
#     stamps it.
#
# Failure mode (intentional no-op):
#
#   If ANY condition fails, the workflow finishes successfully without
#   calling `gh pr merge --auto`.  The PR sits open for manual review
#   exactly like today - zero regression in the default path.
#
# ─── Token: why GITHUB_TOKEN alone strands the PR ───────────────────────
#
#   Auto-merge armed with the default `GITHUB_TOKEN` records an
#   AutoMergeEnabledEvent but NEVER produces an AddedToMergeQueueEvent:
#   GitHub's anti-loop design means GITHUB_TOKEN actions don't trigger
#   the merge queue's enrollment (same limitation documented for tag
#   pushes in `release-plz.yml`).  Observed on PRs #40/#41 - both sat
#   CLEAN with auto-merge "enabled" for hours, queue empty.
#
#   Fix: mint a GitHub App installation token and arm auto-merge with
#   THAT.  Reuses the repo-wide app credentials release-plz.yml already
#   designates (`APP_ID` + `APP_PRIVATE_KEY`).  Setup:
#
#     1. Create a GitHub App (permissions: Contents R/W,
#        Pull requests R/W), install it on this repo.
#     2. Store the credentials as **Dependabot** secrets - this
#        workflow runs on Dependabot-actor `pull_request` events, which
#        read the Dependabot secrets store, NOT the Actions one:
#          gh secret set APP_ID          --app dependabot
#          gh secret set APP_PRIVATE_KEY --app dependabot
#        (Add them as Actions secrets too if other workflows want them.)
#
#   Fallback: if the secrets are absent (fresh template clone), the
#   step is skipped and we arm with GITHUB_TOKEN as before - auto-merge
#   then needs one manual nudge per PR (enqueue via UI/API), which is
#   the pre-fix behavior, not a regression.

name: "🤖 Dependabot auto-merge (patch-level)"

on:
  pull_request:
    # Only events we care about.  `labeled` is included so a
    # maintainer can trigger a re-evaluation by re-labeling the PR
    # after a failed auto-merge attempt.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# Read-only at the workflow level; each job names what it uses.
permissions:
  contents: read

# One evaluation per PR at a time.  `cancel-in-progress: true` because
# a superseded Dependabot sync (new commit lands) means the previous
# evaluation's metadata is stale.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actions-review:
    name: Dependabot Actions review
    # The PR's author, not `github.actor`: the actor is whoever caused
    # this event (Dependabot itself when it rebases a PR someone else
    # opened, a maintainer when they re-label), the author is who opened
    # the PR.  Human PRs pay nothing.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout PR with one commit of history
        # `fetch-depth: 2` → HEAD and HEAD~1 so we can diff the set of
        # `uses:` references before/after the bump.  Pin `ref:` to the
        # PR head SHA (Dependabot's actual bump commit) so HEAD~1 is
        # deterministically the pre-bump tree, not a synthetic merge
        # commit (as `dependabot-review.yml` does).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Diff action references (new actions + non-SHA pins)
        shell: bash
        run: |
          set -euo pipefail

          # Collect the unique `uses:` references at a given git ref.
          # Handles both `uses: x` (job-level) and `- uses: x` (step in a
          # list), strips trailing `# vX.Y.Z` comments, and drops local
          # composite actions (`./...`) and docker refs (`docker://...`),
          # neither of which is a remote-tag/SHA supply-chain concern.
          # Command substitutions keep `set -e` (bash drops it there by
          # default), so a failure inside collect_uses stops the job.
          shopt -s inherit_errexit
          # Every git read is checked (a failure stops the job; it never
          # reads as "no actions"), and the filtering is one awk pass, so
          # no grep "no match" exit status needs swallowing.
          collect_uses() {
            local gitref="$1" files f
            files="$(git ls-tree -r --name-only "$gitref" -- .github/workflows .github/actions)"
            while IFS= read -r f; do
              case "$f" in
                *.yml|*.yaml) git show "$gitref:$f" ;;
              esac
            done <<< "$files" \
              | awk '{
                  line = $0
                  while (match(line, /uses:[[:space:]]*[^[:space:]#]+/)) {
                    ref = substr(line, RSTART, RLENGTH)
                    sub(/^uses:[[:space:]]*/, "", ref)
                    if (ref !~ /^(\.\/|docker:\/\/)/) print ref
                    line = substr(line, RSTART + RLENGTH)
                  }
                }' \
              | sort -u
          }

          BEFORE_FULL=$(collect_uses 'HEAD~1')
          AFTER_FULL=$(collect_uses 'HEAD')

          # Action *identity* = everything before the `@` (org/repo[/path]).
          names() { awk 'NF' | sed -E 's/@[^@]*$//' | sort -u; }
          BEFORE_NAMES=$(names <<< "$BEFORE_FULL")
          AFTER_NAMES=$(names <<< "$AFTER_FULL")
          count() { awk 'NF{n++} END{print n+0}' <<< "$1"; }

          # (1) Actions present after the bump but never before = new trust deps.
          NEW_ACTIONS=$(comm -13 <(printf '%s\n' "$BEFORE_NAMES") <(printf '%s\n' "$AFTER_NAMES"))

          # (2) Non-SHA pins among the post-bump references. The ref after the
          # final `@` must be a 40-char lowercase hex SHA; anything else
          # (tag, branch, short SHA) is a weaker pin.
          UNPINNED=""
          while IFS= read -r u; do
            [[ -z "$u" ]] && continue
            ref="${u##*@}"
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              UNPINNED+="${u}"$'\n'
            fi
          done <<< "$AFTER_FULL"
          UNPINNED=$(awk 'NF' <<< "$UNPINNED")

          # ── Step summary (always, for retroactive audit) ──────────────
          {
            echo "## 🔗 Dependabot Actions review"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Distinct actions before (HEAD~1) | \`$(count "$BEFORE_NAMES")\` |"
            echo "| Distinct actions after (HEAD)    | \`$(count "$AFTER_NAMES")\` |"
            echo "| New actions introduced           | \`$(count "$NEW_ACTIONS")\` |"
            echo "| Non-SHA pins after bump          | \`$(count "$UNPINNED")\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          STATUS="ok"

          if [[ -n "$NEW_ACTIONS" ]]; then
            STATUS="fail"
            ONE_LINE=$(printf '%s' "$NEW_ACTIONS" | paste -sd ',' -)
            echo "::error file=.github/workflows::Dependabot PR introduces NEW GitHub Action(s): ${ONE_LINE}. A maintainer confirms the publisher/org is the intended one (typo-squat / look-alike defense) and merges by hand."
            {
              echo "### 🆕 New action(s) introduced"
              echo ""
              echo '```'
              printf '%s\n' "$NEW_ACTIONS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -n "$UNPINNED" ]]; then
            STATUS="fail"
            echo "::error file=.github/workflows::One or more actions are NOT pinned to a full 40-char commit SHA. Repo policy is SHA-pinning (immutable) with the tag in a trailing comment. Pin these before merging."
            {
              echo "### 📌 Non-SHA-pinned action reference(s)"
              echo ""
              echo '```'
              printf '%s\n' "$UNPINNED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$STATUS" == "ok" ]]; then
            echo "✅ **Within bounds** - SHA-only bump of existing action(s); no annotation emitted." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Diagnostic echo to the job log.
          echo "New actions:"; printf '%s\n' "${NEW_ACTIONS:-<none>}"
          echo "Non-SHA pins:"; printf '%s\n' "${UNPINNED:-<none>}"

          # A new or unpinned action fails the review, so auto-merge
          # (which needs this job) never arms the PR.
          [[ "$STATUS" == "ok" ]]

  auto-merge:
    name: Enable auto-merge if eligible
    # Only after the Actions review passed on this head commit.
    needs: actions-review
    # Short-circuit on non-Dependabot PRs so human contributors pay
    # zero CI minutes when this workflow fires (the PR's author, as in
    # the job above).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read PR metadata + enable auto-merge.  No other writes.
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` isn't a legal context in step-level `if:`, so surface
      # "are the app credentials configured?" here where it is legal.
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # Extracts `update-type`, `dependency-names`,
        # `package-ecosystem`, etc. from the Dependabot PR body.
        # Pinned to a commit SHA like every other action in this repo.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate eligibility
        id: gate
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
        run: |
          set -euo pipefail

          echo "Dependabot metadata:"
          echo "  update-type        = $UPDATE_TYPE"
          echo "  package-ecosystem  = $ECOSYSTEM"
          echo "  dependency-names   = $DEP_NAMES"
          echo "  alert-state        = $ALERT_STATE"

          eligible=false
          reason=""

          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
            # Security-advisory updates get manual review regardless of
            # semver level, so the reviewer sees the advisory notes.
            if [[ -z "$ALERT_STATE" || "$ALERT_STATE" == "AUTO_DISMISSED" ]]; then
              eligible=true
              reason="patch-level bump, no active security advisory \u2192 auto-merge eligible"
            else
              reason="security-advisory bump (alert=$ALERT_STATE) \u2192 manual review"
            fi
          else
            reason="update-type=$UPDATE_TYPE (not patch-level) \u2192 manual review"
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "reason=$reason"     >> "$GITHUB_OUTPUT"

          echo ""
          echo "Decision: $eligible ($reason)"

          # Surface the decision in the PR check summary so reviewers
          # can see at a glance whether auto-merge is on.
          {
            echo "## 🤖 Dependabot auto-merge evaluation"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| update-type | \`$UPDATE_TYPE\` |"
            echo "| package-ecosystem | \`$ECOSYSTEM\` |"
            echo "| dependency-names | \`$DEP_NAMES\` |"
            echo "| alert-state | \`${ALERT_STATE:-none}\` |"
            echo "| eligible | **$eligible** |"
            echo "| reason | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mint GitHub App token
        id: app-token
        # Only when the gate is green AND the app credentials exist (see
        # the "Token" section in the header for setup).  No
        # `continue-on-error`: if the secrets are set but minting fails,
        # that's a misconfiguration we want loud, not a silent fallback.
        if: steps.gate.outputs.eligible == 'true' && env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # This repository only, and only the two scopes arming
          # auto-merge uses - never everything the app may do.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge via gh CLI
        # Only call `gh pr merge --auto` when the gate is green.  This step
        # also fires on `synchronize`, so it re-arms auto-merge after an
        # Update-branch.  Why the method flag is named: see the comment in
        # the script below.
        #
        # Token preference: app token when minted (actually enrolls in the
        # merge queue), GITHUB_TOKEN otherwise (arms auto-merge but needs a
        # manual enqueue nudge - see header).
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Enabling auto-merge on $PR_URL"
          # `--merge` is named: this repository has no merge queue to set the
          # method, and merge commits are the only method its settings and
          # ruleset allow. The merge waits for every required check, which
          # includes the supply-chain vet and the tests on all three systems.
          gh pr merge --auto --merge "$PR_URL"
          echo "::notice::Auto-merge enabled \u2014 will merge when all required checks pass and reviews (if any) are satisfied."
