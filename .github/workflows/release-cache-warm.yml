#
# Release-cache warming.
#
# What this workflow is for now:
#
#   It was written to keep `release.yml`'s dependency cache from aging
#   out between releases.  `release.yml` no longer restores any cache:
#   what a release build compiles is what ships, and a cache restores
#   files another workflow run wrote (cache poisoning), so every release
#   build is cold by design.  The cache this workflow saves is therefore
#   read only by this workflow itself.
#
#   What it still does: it builds every release target from `main`, with
#   the release build's own command and flags, on every push that can
#   change that build and once a week.  A release target that stops
#   building on `main` fails here first, days before a release would
#   find it.
#
# Cost calibration:
#
#   ~3 × 45 min CI per trigger × ~weekly Cargo.lock-touching pushes
#   plus a weekly cron = ~5-10 hours/week on the public-repo free
#   minutes.

name: 🔥 Release cache warm

on:
  push:
    branches: [main]
    paths:
      # Only rebuild when something a release-mode build cares about
      # changes.  Pure-docs / scripts / CHANGELOG-only changes can't
      # break it, so they shouldn't re-trigger a 45-min
      # compile per platform.  Mirror the file set against
      # `release.yml`'s `cargo build -p md2html --bins` - anything
      # that influences that command's input set must be listed here.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      # Also re-trigger if THIS workflow changes (so a config tweak
      # to the warming logic re-runs against current main).
      - '.github/workflows/release-cache-warm.yml'
  schedule:
    # Weekly cron - Monday 05:00 UTC.  Catches what changes without a
    # push: a runner image or the pinned toolchain's download breaking
    # a release target.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    # Manual re-trigger: check the release targets on `main` before
    # pushing the next release tag.

# Cancel older in-flight warm runs when a new commit lands: only the
# latest commit's build is interesting, and this workflow publishes
# nothing.  `release.yml` runs are NOT in this concurrency group,
# so a tag-dispatched release won't be canceled by a same-time main
# push.
concurrency:
  group: release-cache-warm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read repo contents.  No write scope - this workflow ships nothing.
  contents: read
  # Cache read/write happens via the actions/cache backend, not via
  # the `actions:` permission scope.  Documented here for explicitness.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Override `.cargo/config.toml`'s `rustc-wrapper = "sccache"` setting
  # for the same reason `release.yml` does - sccache isn't preinstalled
  # on GitHub-hosted runners and would crash every `cargo` invocation
  # at exec time.  Empty `RUSTC_WRAPPER` disables the wrapper without
  # touching `config.toml`.
  RUSTC_WRAPPER: ""

jobs:
  warm:
    # Mirrors `release.yml::build-release-binaries`'s matrix exactly.
    # If you add or change a target there, change it here too -
    # otherwise the new target is not built here before a release.
    name: 🔥 Warm ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Dormancy guard: building the release targets only makes sense once
    # the release lane itself is enabled (repo variable LANE_RELEASE =
    # 'true').
    if: vars.LANE_RELEASE == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    # A failed warm build fails the job: a release target that does not
    # build on main is the earliest warning the release lane gets.  A
    # transient flake is retried once inside the build step, then by
    # auto-rerun-transient; what survives files an issue through
    # ci-failure-notify.
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: "-C target-cpu=x86-64-v3"
            timeout: 75
          - target: aarch64-apple-darwin
            os: macos-latest
            rustflags: "-C target-cpu=apple-m1 -C link-arg=-Wl,-dead_strip"
            timeout: 45
          - target: x86_64-apple-darwin
            os: macos-latest
            rustflags: "-C link-arg=-Wl,-dead_strip"
            timeout: 45
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            rustflags: "-C target-cpu=x86-64-v3 -C link-arg=-Wl,--gc-sections"
            timeout: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Same recovery as `release.yml`: LTO=fat release builds need
          # more than ubuntu-22.04's default free disk.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/local/graalvm
          df -h /

      - name: Install pinned nightly (from rust-toolchain.toml)
        shell: bash
        run: |
          # `rustup show` reads `rust-toolchain.toml` and installs the
          # exact channel + components pinned there.
          rustup show

          # Defensive: on `macos-latest` runner images the
          # `~/.cargo/bin/cargo` proxy is occasionally a stale symlink
          # pointing at `rustup-init` (the installer) instead of the
          # proxy that forwards to the active toolchain's real cargo.
          # When that happens, every subsequent `cargo build` /
          # `cargo metadata` exits with `error: unexpected argument
          # 'build' found` and a `rustup_init::run_rustup_inner`
          # backtrace.  Forcibly re-setting the default toolchain
          # rewrites the proxy binaries in `~/.cargo/bin`, so the
          # symlinks resolve to the active toolchain's cargo.
          rustup default "$(rustup show active-toolchain | awk '{print $1}')"

          # Fail-fast smoke check: surface a broken proxy in ~1 s here
          # instead of letting Swatinem/rust-cache's `cargo metadata`
          # (and then a 30+ min `cargo build`) silently waste runner
          # minutes before failing on the same root cause.
          cargo --version
          rustc --version

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Read by this workflow only: `release.yml` restores no cache
          # (see the header).  This workflow publishes nothing, so a
          # cache here cannot reach a release.
          shared-key: release-${{ matrix.target }}
          # Save even on a partial / failed build so a slow-evolving
          # cache still progresses toward warm rather than alternating
          # between empty and populated.
          cache-on-failure: 'true'

      - name: Repair rustup proxy after cache restore (macOS guard)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # `Swatinem/rust-cache`
          # restores `~/.cargo/bin/` from a prior run's cache, which on
          # `macos-latest` can hold a poisoned `cargo` symlink pointing
          # at `rustup-init` instead of the toolchain proxy.  Re-running
          # `rustup default` *after* the restore rewrites the proxy so
          # the subsequent `cargo build` reaches the real cargo.
          #
          # Without this step the cache-warm workflow itself would re-
          # save the poisoned cache on every macOS run, perpetuating
          # a poisoned proxy.  Fixing it here lets the next successful
          # warm run save a clean cache.
          rustup default "$(rustup show active-toolchain | awk '{print $1}')"
          cargo --version

      - name: Set up cargo-zigbuild for static musl (Linux only)
        # Mirrors release.yml's step of the same name (same pins).
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          python3 -m pip install --user "ziglang==0.17.1"
          printf 'exec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install --locked cargo-zigbuild@0.24.1

      - name: Pre-warm release-mode build cache
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "🔥 Warming release cache for ${{ matrix.target }}"
          echo "   RUSTFLAGS=$RUSTFLAGS"

          # Identical invocation to `release.yml::build-release-binaries`.
          # If that command's flags ever diverge from this one, this
          # workflow checks a build the release does not run - keep them
          # aligned.
          # `--locked`, as every build of the workspace
          # (docs/policies/dependency_policy.md).
          #
          # Single auto-retry on failure absorbs GitHub-runner-image
          # flakes (transient network blips during dep download,
          # occasional rustup proxy regressions on macos-latest that
          # the Install-step's repair didn't catch, etc.) without
          # making release pipeline maintainers babysit re-runs.  The
          # 10-s sleep lets transient network state recover before the
          # second attempt.
          set -euo pipefail
          build() {
            if [[ "$TARGET" == *musl* ]]; then
              cargo zigbuild --locked --release --target "$TARGET" -p md2html --bins
            else
              cargo build --locked --release --target "$TARGET" -p md2html --bins
            fi
          }
          for attempt in 1 2; do
            rc=0
            build || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "✅ Cache warmed for ${{ matrix.target }} on attempt $attempt"
              exit 0
            fi
            echo "::warning::cargo build for ${{ matrix.target }} failed on attempt $attempt (exit $rc); retrying after 10s..."
            sleep 10
          done
          echo "::error::cargo build for ${{ matrix.target }} failed twice; giving up."
          exit 1
