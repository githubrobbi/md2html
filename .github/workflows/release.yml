#
# ─── How a release starts ───────────────────────────────────────────────
#
# Every release tag is signed by the owner: after the `release/vX.Y.Z`
# pull request merges, `just release-tag` on an up-to-date `main` signs
# `vX.Y.Z` and pushes it, and that push starts this workflow.  The
# workflow never makes a tag.  The dispatch below exists only to run it
# again for a tag that is already there (a run that could not start, or
# one past re-running); it builds the commit the tag names, and refuses
# a version with no tag, a tag that is not annotated, or one whose
# signature GitHub does not verify (docs/policies/release_policy.md,
# steps 8 to 10).

name: 🚀 MD2HTML Release Pipeline

run-name: 🚀 MD2HTML Release ${{ inputs.version || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The signed tag to release again (e.g. v0.8.0); it must exist already'
        required: true
        type: string
  push:
    tags:
      - 'v*'

# Serialise release runs so a tag's push and a dispatch for the same tag
# queue cleanly.  `cancel-in-progress: false` because a half-finished
# release must either complete or fail with an attestation - never be
# killed mid-upload - so the SLSA provenance in the Attestations API
# can never claim an artifact that was not actually published.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Nothing at the workflow level.  A job's own `permissions:` block
# replaces the workflow-level set entirely (it neither inherits from it
# nor is capped by it), and every job below declares exactly the scopes
# it uses: `contents: write` where a release is made, `actions:
# write` only in the jobs that dispatch another workflow, `id-token` and
# `attestations` only where the SLSA provenance is signed
# (create-github-release: `id-token: write` lets the runner mint the
# OIDC token Sigstore Fulcio certifies, `attestations: write` posts the
# attestation to the GitHub Attestations API), `issues: write` only in
# the failure notice.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # What started the run, for the release notes and the summary.
  TRIGGERED_BY: ${{ github.event_name == 'workflow_dispatch' && 'a dispatch for the existing signed tag' || 'the push of the signed tag' }}
  # Override `.cargo/config.toml`'s `rustc-wrapper = "sccache"` setting.
  # sccache is a developer-machine convenience (`cargo install sccache`);
  # GitHub-hosted runners don't have it pre-installed, so every `cargo`
  # invocation fails immediately with `could not execute process sccache …`
  # (see fork test run #24777036796 where all three build targets hit
  # exit code 101 on this).  An empty `RUSTC_WRAPPER` disables the wrapper
  # without touching config.toml (which would hurt local dev UX).
  # `pr-fast.yml` carries the same override for the same reason.
  RUSTC_WRAPPER: ""
  # NOTE: no workflow-level RUSTFLAGS here.  Each matrix row carries its own
  # `rustflags` field so every target gets a stable CPU baseline appropriate
  # for its ISA - never `target-cpu=native`, because a release binary built
  # on today's GitHub runner would SIGILL on any end-user CPU missing the
  # runner's detected feature set (observed previously with `target-cpu=native`
  # → proc-macro dylib SIGILL on nightly-2026-04-21; same rationale noted
  # in `pr-fast.yml`'s top-level env block).
  # Baselines used below:
  #   x86_64 Linux / Windows   : x86-64-v3 (Haswell+/Zen+, AVX2+BMI2+FMA)
  #   aarch64-apple-darwin     : apple-m1  (M1+, forward-compatible with M2/M3/M4)

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: Release Preparation & Validation
  # ═══════════════════════════════════════════════════════════════════════════

  release-preparation:
    name: 📋 Release Preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dormancy guard: the whole release lane stays present-but-inert
    # until the repo variable LANE_RELEASE is set to 'true'
    # (Settings → Secrets and variables → Actions → Variables).
    if: vars.LANE_RELEASE == 'true'
    # This job needs `contents: write` for its `gh release create
    # --draft` preflight (reading the tag needs only read, which write
    # includes); nothing else, so no `actions` scope at all.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      release-name: ${{ steps.validate.outputs.release-name }}
      # The commit the signed tag names: every later job checks out this,
      # never the ref the run was started from.
      commit: ${{ steps.signed-tag.outputs.commit }}
    steps:
      - name: Checkout repository
        # Full history and every tag; the step that reads the tag then
        # switches to the commit it names.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Handle both workflow_dispatch and tag push
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: v0.1.192"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=$VERSION"
            echo "release-name=MD2HTML $VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "✅ Release validation passed"
          echo "📦 Version: $VERSION"
          echo "🏷️ Tag: $VERSION"
          echo "🚀 Triggered by: $TRIGGERED_BY"

      - name: Pre-flight - verify Actions token can create releases
        # Belt-and-suspenders guard against a silent repo-level
        # permissions clamp.
        #
        # The `create-github-release` job declares `contents: write`,
        # which it needs in order to create the release row on the
        # signed tag.  However,
        # the repository-level toggle at "Settings → Actions →
        # General → Workflow permissions" can clamp every job's
        # GITHUB_TOKEN to read-only at runtime regardless of what
        # the workflow declares.  When that happens, the build
        # matrix burns ~30 minutes and then `create-github-release`
        # dies with the cryptic:
        #
        #   HTTP 403 - Resource not accessible by integration
        #
        # The failure mode is silent until that step is reached, after
        # every platform has built.
        #
        # This step exercises the EXACT REST path that the release
        # step uses, but with a throwaway draft release that is
        # immediately deleted.  A read-only-clamped token fails the
        # `gh release create --draft` call in ~1 s with the same 403,
        # at which point we surface a precise actionable error
        # pointing at the toggle that needs flipping.
        #
        # Why a draft release and not a direct `actions/permissions`
        # API probe: reading `/repos/.../actions/permissions/workflow`
        # requires the `administration: read` scope, which neither
        # this workflow nor the repo-default GITHUB_TOKEN carries.
        # The synthetic create-draft-then-delete probe uses the
        # `contents: write` scope this job already declares, so it
        # works without widening the workflow's permission surface.
        #
        # Draft releases do not create the underlying git tag (only
        # published releases do), so cleanup is just the release-row
        # delete - no orphaned tags can leak even if the cleanup
        # step itself fails.  The throwaway tag name includes both
        # `run_id` and `run_attempt` so concurrent / retried
        # invocations cannot collide.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TEST_TAG="preflight-permcheck-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          echo "Probing release-create permissions with synthetic draft: $TEST_TAG"

          if ! gh release create "$TEST_TAG" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --draft \
                 --notes "Preflight permissions check; auto-deleted within seconds." \
                 --title "permcheck (auto-deleted)" 2>/tmp/perm-err.log; then
              ERR=$(cat /tmp/perm-err.log)
              echo "::error title=Workflow permissions block release publish::Failed to create a draft release as a preflight permissions probe - see annotation below."
              cat <<EOF
          ❌ Pre-flight permissions probe FAILED.

          The probe attempted to create a draft release ($TEST_TAG)
          and \`gh release create\` returned:

          ${ERR}

          Most common cause: the repository's "Workflow permissions"
          setting is "Read repository contents and packages
          permissions", which clamps the per-job GITHUB_TOKEN to
          read-only at runtime regardless of what the workflow file
          declares.  The release step in the
          create-github-release job would fail with HTTP 403
          ("Resource not accessible by integration") after the build
          matrix (~30 min).  Catching it here saves the ~30 min.

          To fix, flip the toggle to "Read and write permissions":
            https://github.com/${GITHUB_REPOSITORY}/settings/actions

          Or via CLI (requires repo admin):
            gh api -X PUT /repos/${GITHUB_REPOSITORY}/actions/permissions/workflow \\
              -f default_workflow_permissions=write

          If the repo-level setting is already "Read and write" but
          the probe still fails, the organization's default at
            https://github.com/organizations/<org>/settings/actions
          may be set to read-only and is cascading down to every repo.
          Fix it at the org level (or have an org admin do it), then
          re-dispatch this workflow.
          EOF
              exit 1
          fi

          # Cleanup: delete the draft release row.  Best-effort - if
          # delete fails, the draft is orphaned but harmless (drafts
          # do not create git tags, are not surfaced on the public
          # /releases page, and the unique tag name per
          # run_id+attempt prevents cross-run collisions).
          if ! gh release delete "$TEST_TAG" \
                 --repo "${GITHUB_REPOSITORY}" --yes; then
              echo "::warning::Failed to clean up preflight draft release $TEST_TAG; orphan is harmless but visible to repo admins via /releases?per_page=100."
          fi

          echo "✅ Workflow permissions allow release publish"

      - name: The tag exists, is signed, and names the commit to build
        # Both paths.  The workflow makes no tag: on a push the signed tag
        # started the run, on a dispatch it must be there already.  The
        # commit it names is what every job builds and releases.
        id: signed-tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # Guard 1 - the tag, read from GitHub (not from this checkout,
          # which could be stale): the ref, then the annotated tag object
          # it points at.  A lightweight tag carries no signature, so it
          # is refused; so is a tag whose signature GitHub does not
          # verify (`verification.verified` of the tag object: the
          # signature is good and its key belongs to the GitHub account
          # whose verified email is the tagger's).
          if ! ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
                        --jq '"\(.object.type) \(.object.sha)"')"; then
            echo "::error title=No tag ${TAG}::There is no tag ${TAG}.  This workflow never makes one: run \`just release-tag\` on an up-to-date main, whose push starts the release."
            exit 1
          fi
          read -r ref_type tag_object <<< "$ref"
          if [[ "$ref_type" != "tag" ]]; then
            echo "::error title=Tag ${TAG} is not signed::${TAG} is a lightweight tag (it points at a ${ref_type}), so it carries no signature.  Every release tag is an annotated tag signed by \`just release-tag\`."
            exit 1
          fi
          fields="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
                      --jq '"\(.tag) \(.verification.verified) \(.verification.reason) \(.object.type) \(.object.sha)"')"
          read -r name verified reason target_type commit <<< "$fields"
          if [[ "$name" != "$TAG" ]]; then
            echo "::error title=Tag ${TAG} names itself ${name}::The ref ${TAG} points at a tag object named ${name}."
            exit 1
          fi
          if [[ "$verified" != "true" ]]; then
            echo "::error title=Tag ${TAG} is not verified::GitHub does not verify the signature of ${TAG} (reason: ${reason}).  Every release tag is signed by \`just release-tag\` with a key registered on GitHub as a signing key."
            exit 1
          fi
          if [[ "$target_type" != "commit" ]]; then
            echo "::error title=Tag ${TAG} names no commit::${TAG} points at a ${target_type}, not a commit."
            exit 1
          fi
          # The checkout fetched every tag; the local tag must name the
          # same commit, and that commit is what this job reads from here.
          if ! local_commit="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error title=Tag ${TAG} not fetched::GitHub has ${TAG}, the checkout does not.  Run the workflow again."
            exit 1
          fi
          if [[ "$local_commit" != "$commit" ]]; then
            echo "::error title=Tag ${TAG} moved::GitHub says ${TAG} names ${commit}; the checkout says '${local_commit}'.  Run the workflow again once the tag is settled."
            exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "✅ ${TAG} is signed (${reason}) and names ${commit}"

      - name: Check that no release exists for the tag (both paths)
        # On both paths: a tag pushed for a version that already has a
        # release would otherwise build every target and then fail at
        # `gh release create`.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          # Guard 2 - GitHub release row.  Since 2025-Q4 GitHub publishes
          # releases as immutable by default.  When a release row exists
          # for $TAG but the git tag has been rolled back (e.g. a previous
          # release attempt failed AFTER the release was created but
          # BEFORE artifacts uploaded, then the tag was manually deleted),
          # `gh release create` in create-github-release refuses the
          # existing row - after the whole build matrix has run.
          #
          # The remedy is to bump the version, not to retry.  Surfacing
          # that here gives a clear error before the build instead of
          # after it.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error title=Release ${TAG} already published::A release for ${TAG} already exists on GitHub and is immutable.  GitHub does not allow re-publishing the same version.  The fix goes out as the next version: just ship, just merge, just release-tag."
            exit 1
          fi

          echo "✅ No release for ${TAG} yet"

      - name: The released commit is on main and carries the tag's version
        # Both paths: the commit the signed tag names.
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.signed-tag.outputs.commit }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          # The guard against a tag on a commit that never reached main
          # (an unreviewed branch, or a commit before a security fix):
          # a signature says who tagged, not that the commit was reviewed.
          # This step rejects any commit that isn't on main's history.
          #
          # `git merge-base --is-ancestor A B` exits 0 iff A is an
          # ancestor of B (commits equal count as ancestor).
          git fetch origin main:refs/remotes/origin/main --quiet
          if ! git merge-base --is-ancestor "${COMMIT_SHA}" origin/main; then
            echo "::error::${TAG} names ${COMMIT_SHA}, which is not an ancestor of origin/main."
            echo "  Only commits that have already landed on main can be released."
            echo "  If this commit is legitimate, merge it to main first."
            exit 1
          fi
          echo "✅ ${COMMIT_SHA} is on main's history"

          # The version is said in three places (AGENTS.md, section 11):
          # the manifest, the capabilities pages and the changelog's newest
          # release.  The tag must name it too, or the binaries would say
          # another version than their release (scripts/ci/versions.py, the
          # gate `versions`).
          python3 scripts/ci/versions.py check --tag "${TAG}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: Cross-Platform Binary Builds
  # ═══════════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────────
  # Target matrix
  #
  # Three targets, each earning its slot:
  #   - x86_64-pc-windows-msvc   - Windows x64
  #   - aarch64-apple-darwin     - macOS Apple Silicon
  #   - x86_64-unknown-linux-musl - Linux x64 (servers, Docker, CI
  #                                 harnesses).  STATIC (no glibc floor)
  #                                 → runs on every Linux incl. old
  #                                 LTS / WSL / Alpine.
  #
  # Dropped vs previous iterations:
  #   - x86_64-apple-darwin (Intel Mac) - Apple deprecated the platform;
  #     Apple Silicon ARM64 build runs under Rosetta 2 if absolutely needed.
  #
  # Per-target `rustflags` (stable baselines, never `native`):
  #   - x86_64 Linux/Windows: `target-cpu=x86-64-v3` - Haswell+/Zen+ ISA.
  #   - aarch64 macOS:         `target-cpu=apple-m1` - M1 baseline forwards-
  #     compatible with M2/M3/M4 while avoiding config.toml's `native`
  #     override which would bake in runner-specific chip detection.
  # ─────────────────────────────────────────────────────────────────────────
  build-release-binaries:
    name: 🔨 Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: release-preparation
    # Dormancy guard (see release-preparation).
    if: vars.LANE_RELEASE == 'true'
    timeout-minutes: ${{ matrix.timeout }}
    # The build only checks out + compiles + uploads artifacts - no
    # write scope is needed.
    permissions:
      contents: read
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Timeouts are sized for a COLD build, which every release
          # build is (no dependency cache; see the build step).
          # LTO=fat + codegen-units=1 is slow on 2-core GitHub-hosted
          # runners.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact-name: md2html-windows-x64
            binary-suffix: ".exe"
            rustflags: "-C target-cpu=x86-64-v3"
            timeout: 75
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact-name: md2html-macos-arm64
            binary-suffix: ""
            rustflags: "-C target-cpu=apple-m1 -C link-arg=-Wl,-dead_strip"
            timeout: 45
          # Intel Macs stay a target (a 2015 MacBook Pro is a real field
          # machine); cross-compiled on the arm64 runner, no extra SDK.
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact-name: md2html-macos-x64
            binary-suffix: ""
            rustflags: "-C link-arg=-Wl,-dead_strip"
            timeout: 45
          # musl = fully STATIC binary, zero glibc dependency: a gnu build on
          # ubuntu-22.04 (glibc 2.35) bakes a glibc floor that breaks Ubuntu
          # 20.04 / WSL (glibc 2.31: "GLIBC_2.33 not found"). The static musl
          # binary runs on every Linux (20.04, Alpine, old servers) forever.
          # Built via cargo-zigbuild (zig supplies the C cross-toolchain +
          # static link cleanly).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            artifact-name: md2html-linux-x64
            binary-suffix: ""
            rustflags: "-C target-cpu=x86-64-v3 -C link-arg=-Wl,--gc-sections"
            timeout: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-preparation.outputs.commit }}
          persist-credentials: false

      - name: Free up disk space (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Reclaim ~20GB from preinstalled SDKs a release build does not
          # use; LTO=fat builds need more than the default free disk.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/local/graalvm
          df -h /

      - name: Install pinned nightly (from rust-toolchain.toml)
        shell: bash
        run: |
          # `rustup show` reads `rust-toolchain.toml` and installs the
          # exact channel + components pinned there.
          rustup show

          # Defensive: on `macos-latest` runner images the
          # `~/.cargo/bin/cargo` proxy is occasionally a stale symlink
          # pointing at `rustup-init` (the installer) instead of the
          # proxy that forwards to the active toolchain's real cargo.
          # When that happens, every subsequent `cargo build` /
          # `cargo metadata` exits with `error: unexpected argument
          # 'build' found` and a `rustup_init::run_rustup_inner`
          # backtrace.  Forcibly re-setting the default toolchain
          # rewrites the proxy binaries in `~/.cargo/bin`, so the
          # symlinks resolve to the active toolchain's cargo.
          #
          # This step mirrors the same defensive repair in
          # `release-cache-warm.yml`; keep them in sync.  That workflow
          # also re-applies the repair after its cache restore; this job
          # restores no cache, so once is enough here.
          rustup default "$(rustup show active-toolchain | awk '{print $1}')"

          # Fail-fast smoke check: surface a broken proxy in ~1 s here
          # instead of letting Swatinem/rust-cache's `cargo metadata`
          # (and then a 30+ min `cargo build`) silently waste runner
          # minutes before failing on the same root cause.  On the
          # production release pipeline this matters even more: a 30+
          # min late failure on a tag-dispatched run delays the
          # release by a full re-run cycle.
          cargo --version
          rustc --version

      - name: Set up cargo-zigbuild for static musl (Linux only)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          # musl static Linux is built with cargo-zigbuild: zig provides the C
          # cross-toolchain (mimalloc's C compiles cleanly) and a static musl
          # link, without the musl-gcc / CC_* env fiddling plain cargo needs.
          # Pinned zig via the `ziglang` PyPI wheel (no marketplace action).
          # Pinned to the exact zig + cargo-zigbuild the maintainer validated
          # the static-musl build with locally (this workflow leg only runs at
          # release time, so it cannot drift-test itself - pin what is proven).
          rustup target add ${{ matrix.target }}
          python3 -m pip install --user "ziglang==0.17.1"
          # cargo-zigbuild finds zig via `python3 -m ziglang`; expose it on PATH
          # as `zig` for good measure.
          printf 'exec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install --locked cargo-zigbuild@0.24.1
          # No `cargo zigbuild --version` smoke here: `cargo zigbuild <args>`
          # forwards to the `zigbuild` subcommand, which has no `--version`
          # (it errors "unexpected argument '--version'"). The real proof is
          # the `cargo zigbuild --release` build step below; installing at the
          # pinned version already fixes the version.

      - name: Build optimized release binaries
        # Built with no dependency cache: what this step compiles is what
        # ships, and a cache restores files some other workflow run wrote
        # (cache poisoning).  Every release build starts from nothing but
        # the committed sources and Cargo.lock.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "🔨 Building optimized release binaries for ${{ matrix.target }}"
          echo "   RUSTFLAGS=$RUSTFLAGS"

          # Build md2html (the one shipped binary) for the target; the
          # workspace's other members are build tooling.  Profile settings
          # (LTO=fat, codegen-units=1, strip=symbols, panic=abort) come from
          # [profile.release] in Cargo.toml - do NOT override them here.
          # The previous `CARGO_PROFILE_RELEASE_LTO=false` override silently
          # disabled LTO in release artifacts; removed so users get the
          # perf the profile was designed for.
          #
          # --locked (docs/policies/dependency_policy.md).  Release builds MUST resolve
          # through the committed Cargo.lock or the binaries we ship
          # may differ from what the tests validated - worst-case a
          # silent dep drift ships to end-users.  CI fails loudly
          # instead.
          # musl → cargo-zigbuild (static C toolchain via zig); everything else
          # → the native cargo build. Same flags/profile either way.
          if [[ "$TARGET" == *musl* ]]; then
            cargo zigbuild --locked --release --target "$TARGET" -p md2html --bins
          else
            cargo build --locked --release --target "$TARGET" -p md2html --bins
          fi

          echo "✅ Build completed for ${{ matrix.target }}"

      - name: Sign macOS binaries (Developer ID when the secrets exist, ad-hoc otherwise)
        if: contains(matrix.target, 'apple-darwin')
        id: macsign
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # `[profile.release].strip = "symbols"` in Cargo.toml strips the
          # Mach-O symbol table AFTER the linker has emitted an ad-hoc
          # (linker-signed) CodeDirectory.  Strip changes the on-disk hash
          # the CodeDirectory was computed over, leaving the signature
          # internally inconsistent.  macOS 26+'s taskgated then refuses
          # to launch the binary with `SIGKILL (Code Signature Invalid)`.
          # Every binary is therefore re-signed here, one of two ways:
          #
          #   * Developer ID (hardened runtime, Apple timestamp, the
          #     entitlements from packaging/macos/md2html.entitlements) when
          #     the three secrets exist - docs/forge/CODE-SIGNING.md
          #     section 4 lists them and `just secrets-sync-apple` sets
          #     them. The next step notarizes the result.
          #   * ad-hoc (`--sign -`) otherwise: still unnotarized, users see
          #     the standard "open anyway" Gatekeeper prompt on first
          #     launch, but the binary is no longer killed at exec time.
          #
          # Gated on `apple-darwin` so Windows / Linux artifact paths
          # stay untouched.
          set -euo pipefail
          # Add additional workspace binaries here as the project grows.
          bins=(md2html)
          if [[ -n "${APPLE_DEVELOPER_ID_P12:-}" && -n "${APPLE_DEVELOPER_ID_P12_PASSWORD:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            # The .p12 carries macOS's legacy RC2 wrapping: `security import`,
            # never OpenSSL, reads it (docs/forge/CODE-SIGNING.md).
            security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
              -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            rm -f "$RUNNER_TEMP/developer-id.p12"
            for bin in "${bins[@]}"; do
              path="target/${{ matrix.target }}/release/$bin"
              [[ -f "$path" ]] || { echo "::error::$path was not built"; exit 1; }
              codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp \
                --entitlements packaging/macos/md2html.entitlements "$path"
              codesign --verify --verbose=2 "$path"
            done
            echo "developer_id=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Developer ID secrets absent - macOS binaries are ad-hoc signed (unnotarized; see docs/forge/CODE-SIGNING.md section 4)"
            for bin in "${bins[@]}"; do
              path="target/${{ matrix.target }}/release/$bin"
              [[ -f "$path" ]] || { echo "::error::$path was not built"; exit 1; }
              codesign --force --sign - "$path"
              codesign --verify --verbose=2 "$path"
            done
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notarize macOS binaries
        if: contains(matrix.target, 'apple-darwin') && steps.macsign.outputs.developer_id == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # One archive of the signed binaries to the notary service. The
          # ticket is checked ONLINE for bare binaries: a stapled ticket
          # needs a .pkg, .dmg or .app (docs/forge/CODE-SIGNING.md).
          # Developer ID signing ran (the step's condition), so the lane is
          # on: half of it configured is an error, never a quiet
          # unnotarized release.
          if [[ -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER_ID:-}" || -z "${APPLE_API_KEY_P8:-}" ]]; then
            echo "::error::the Developer ID secrets are set but the notarization secrets (APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8) are not - set them (docs/forge/CODE-SIGNING.md section 4)"
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p "$RUNNER_TEMP/notarize/md2html"
          for bin in md2html; do
            path="target/${{ matrix.target }}/release/$bin"
            cp "$path" "$RUNNER_TEMP/notarize/md2html/"
          done
          (cd "$RUNNER_TEMP/notarize" && ditto -c -k --keepParent md2html md2html-notarize.zip)
          xcrun notarytool submit "$RUNNER_TEMP/notarize/md2html-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m 2>&1 | tee "$RUNNER_TEMP/notarize/log.txt"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          grep -q "status: Accepted" "$RUNNER_TEMP/notarize/log.txt" || {
            echo "::error::notarization was not accepted"; exit 1; }

      - name: Show binary sizes
        shell: bash
        run: |
          echo "📐 Release binary sizes:"
          # Iterate the explicit shipping-set names (avoids `ls | grep`, SC2010).
          # Use `if … then … fi` rather than `[[ -f $bin ]] && ls …` so a missing
          # file on the final iteration does not propagate exit-1 out of the
          # loop under `bash -e` (the `.exe` variant is absent on non-Windows
          # targets and vice versa).
          for bin in target/${{ matrix.target }}/release/md2html \
                     target/${{ matrix.target }}/release/md2html.exe; do
            if [[ -f "$bin" ]]; then
              ls -lh "$bin"
            fi
          done

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          # Shipping set: md2html, one binary.  A binary missing from the
          # build is an error (cp fails), never an empty release.
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/md2html.exe" release-artifacts/
          else
            cp "target/${{ matrix.target }}/release/md2html" release-artifacts/
          fi

          # Create checksums.  Using `./*` guards against a future file
          # named like `-foo` being parsed as an option by sha256sum /
          # shasum (SC2035).
          cd release-artifacts
          if command -v sha256sum >/dev/null; then
            sha256sum ./* > checksums.txt
          else
            shasum -a 256 ./* > checksums.txt
          fi

          echo "📦 Packaged binaries:"
          ls -la

      - name: Stage release bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "🎁 Staging release bundle for ${{ matrix.target }}..."

          ARTIFACT="${{ matrix.artifact-name }}"   # e.g. md2html-windows-x64
          TRIPLE="${{ matrix.target }}"
          OS="${{ matrix.os }}"
          BINDIR="target/${TRIPLE}/release"
          if [[ "$OS" == "windows-latest" ]]; then EXT=".exe"; else EXT=""; fi

          # ── Bundle staging helper ──────────────────────────────────────────
          #   $1 = zip basename (also the archive's single root dir)
          stage_bundle() {
            local zipbase="$1"
            local stage="release-staging/${zipbase}"
            rm -rf "$stage"; mkdir -p "$stage"

            cp "${BINDIR}/md2html${EXT}" "$stage/"

            # Licences + docs (md2html is MIT OR Apache-2.0: both texts).
            cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "$stage/"

            # ── ZIP the bundle ───────────────────────────────────────────────
            # 7z on Windows (pre-installed, no Git-Bash zip dependency);
            # `zip` on macOS/Linux.  `cd release-staging` first so the
            # archive's root entry is `${zipbase}/`, not
            # `release-staging/${zipbase}/`.
            if [[ "$OS" == "windows-latest" ]]; then
              (cd release-staging && \
               7z a -tzip "../release-artifacts/${zipbase}.zip" "${zipbase}" > /dev/null)
            else
              (cd release-staging && \
               zip -rq "../release-artifacts/${zipbase}.zip" "${zipbase}")
            fi
            echo "📦 ${zipbase}.zip:"; ls -la "release-artifacts/${zipbase}.zip"
          }

          # Single (normal) tier - the bare `${ARTIFACT}.zip` name keeps the
          # winget installers-regex and download URLs stable.
          stage_bundle "${ARTIFACT}"

          echo "📂 staging tree:"
          find "release-staging/${ARTIFACT}" -maxdepth 4 -type f | sort

          # Clean up staging; only the ZIP survives into the uploaded artifact.
          rm -rf release-staging

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: release-artifacts/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3: Create GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════

  create-github-release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-preparation, build-release-binaries]
    # Dormancy guard (see release-preparation).
    if: vars.LANE_RELEASE == 'true'
    timeout-minutes: 15
    # Explicit per-job permissions matrix: the workflow level grants
    # nothing, so this block is the whole of what the job's token may
    # do.  It is still clamped at runtime by the repo-level "Settings → Actions
    # → General → Workflow permissions" toggle.  If that toggle is set
    # to "Read repository contents and packages permissions", every
    # scope below is silently downgraded to read regardless of what is
    # written here.  The `Pre-flight - verify Actions token …` step in
    # `release-preparation` fails fast in that case so we don't burn
    # ~30 min of build time before discovering it.
    #
    #   contents: write       - the job creates the release row on
    #                            the signed tag (`gh release create`);
    #                            it makes no tag.  Without this scope, the
    #                            create-release step fails with HTTP
    #                            403 "Resource not accessible by
    #                            integration".
    #   id-token: write       - OIDC token issuance for the SLSA
    #                            build-provenance attestation via
    #                            Sigstore Fulcio.
    #   attestations: write   - posts the resulting attestation to
    #                            this repo via GitHub's Attestations
    #                            API.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-preparation.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts

      - name: Organize release assets
        shell: bash
        run: |
          mkdir -p final-release

          # Organize artifacts by platform.  Two shipping formats:
          #   - Per-platform ZIP bundle (everything: binaries + brand +
          #     docs + packaging helpers; the recommended download).
          #   - Individual raw binaries with platform suffix
          #     (backwards-compat URLs for users automating \`wget\` of
          #     a single binary).
          for artifact_dir in release-artifacts/*/; do
            artifact_name=$(basename "$artifact_dir")
            echo "Processing $artifact_name..."

            for file in "$artifact_dir"*; do
              if [[ -f "$file" && "$file" != *"checksums.txt" ]]; then
                filename=$(basename "$file")
                # ZIP bundles keep their original name (the platform
                # suffix is already baked into matrix.artifact-name).
                if [[ "$filename" == *.zip ]]; then
                  cp "$file" "final-release/$filename"
                  continue
                fi
                # Raw binaries get a platform suffix appended.
                if [[ "$artifact_name" == *"linux"* ]]; then
                  cp "$file" "final-release/${filename}-linux-x64"
                elif [[ "$artifact_name" == *"windows"* ]]; then
                  # $filename already ends in .exe from the windows build
                  base="${filename%.exe}"
                  cp "$file" "final-release/${base}-windows-x64.exe"
                elif [[ "$artifact_name" == *"macos-arm64"* ]]; then
                  cp "$file" "final-release/${filename}-macos-arm64"
                elif [[ "$artifact_name" == *"macos-x64"* ]]; then
                  cp "$file" "final-release/${filename}-macos-x64"
                fi
              fi
            done
          done

          echo "📦 Staged release assets (pre-SBOM, pre-checksum):"
          ls -la final-release/

      # ─── CycloneDX SBOM ──────────────────────────────────────────────────
      #
      # Emits one `sbom-<crate>.cdx.json` per workspace crate into
      # `final-release/` so every shipped binary has a machine-readable
      # inventory of its resolved transitive dependencies.  cargo-cyclonedx
      # reads `Cargo.lock` - which is committed - so the SBOMs are
      # deterministic for (commit, features) and bit-identical across
      # re-runs.
      #
      # The SBOMs are produced BEFORE `CHECKSUMS.txt` is written and
      # BEFORE the SLSA attestation step so that:
      #
      #   1. `CHECKSUMS.txt` lists them, giving downloaders a single
      #      sha256-verifiable manifest.
      #   2. The SLSA attestation (`subject-path: final-release/*`) covers
      #      the SBOM bytes too, so a downstream consumer can:
      #
      #        gh attestation verify sbom-md2html.cdx.json \
          #          --owner ${{ github.repository_owner }}
      #
      #      and prove the SBOM came from this exact workflow run.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-cyclonedx

      - name: Install pinned nightly (needed by cargo-cyclonedx to read workspace)
        # cargo-cyclonedx shells out to `cargo metadata`, which requires
        # the workspace's pinned toolchain to be resolvable (rust-toolchain.toml).
        # `rustup show` installs & activates it in one step.
        run: rustup show

      - name: Generate CycloneDX SBOMs for every workspace crate
        shell: bash
        run: |
          set -euo pipefail

          echo "📋 Generating CycloneDX 1.5 SBOMs for workspace..."
          # --format json           : machine-readable
          # --all-features          : match the release-build feature set
          # --spec-version 1.5      : newest stable CycloneDX schema
          # default --describe=crate: one SBOM per crate, Cargo targets as subcomponents
          #
          # Output goes adjacent to each `Cargo.toml` as `<crate>.cdx.json`.
          cargo cyclonedx \
            --format json \
            --all-features \
            --spec-version 1.5

          # Collect the per-crate SBOMs into final-release/ with a uniform
          # `sbom-<crate>.cdx.json` prefix so downloaders can tell at a
          # glance which files are SBOMs.  `find` is used instead of a
          # glob because crates live one level down under crates/<crate>/.
          count=0
          while IFS= read -r sbom; do
            crate=$(basename "$(dirname "$sbom")")
            dest="final-release/sbom-${crate}.cdx.json"
            cp "$sbom" "$dest"
            count=$((count + 1))
          done < <(find crates -name '*.cdx.json' -type f)

          if (( count == 0 )); then
            echo "::error::cargo-cyclonedx produced no SBOMs - investigate the log above"
            exit 1
          fi

          echo "✅ Emitted $count SBOM(s):"
          ls -lh final-release/sbom-*.cdx.json

      - name: Finalize CHECKSUMS.txt (covers binaries, ZIP bundles, and SBOMs)
        shell: bash
        run: |
          cd final-release
          # Regenerate AFTER SBOMs are placed so the manifest is complete.
          # The SLSA attestation runs next and covers every file in this
          # directory, so there is no window where CHECKSUMS.txt is stale
          # relative to what ships.  `./*` guards against future filenames
          # that could be parsed as options by sha256sum (SC2035).
          sha256sum ./* > CHECKSUMS.txt

          # SHA256SUMS - a conventionally-named copy of CHECKSUMS.txt that
          # tooling (e.g. a future self-update helper) can fetch by exact
          # name.  It lists every raw per-binary asset by its platform-
          # suffixed name (e.g. `md2html-windows-x64.exe`).  Identical
          # sha256sum format; generated here (before the attestation step)
          # so it is covered by SLSA when that lane is enabled.
          cp CHECKSUMS.txt SHA256SUMS

          echo "📦 Final release assets (SBOMs + checksums + SHA256SUMS included):"
          ls -la

      - name: Generate SLSA build-provenance attestation
        # Signs every file in `final-release/` with the workflow's
        # Sigstore OIDC identity, producing a SLSA Level 3 build-
        # provenance claim bound to (this workflow run, this commit,
        # this set of inputs).  Consumers then verify with:
        #
        #   gh attestation verify <asset> \
        #     --owner ${{ github.repository_owner }}
        #
        # Attestation is stored in the repo's attestations API, so it
        # survives independently of the GitHub Release asset (even if
        # someone with `contents: write` silently swaps a binary, the
        # SHA256 in the attestation won't match and `gh attestation
        # verify` fails).
        #
        # Lane-guarded: only runs when the repo variable LANE_SLSA is
        # set to 'true' (attestations need Sigstore/Fulcio setup the
        # template repo may not want yet).
        if: vars.LANE_SLSA == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "final-release/*"

      - name: Generate release notes
        id: release-notes
        shell: bash
        # The values reach the notes through the environment and are put
        # in, in one pass, for the `${NAME}`s named below only (Python's
        # string.Template; not envsubst, which is gettext's and not on
        # every runner); the quoted heredoc keeps the shell from reading
        # the text.  What changed comes from CHANGELOG.md's section for the
        # version (scripts/ci/versions.py notes).
        env:
          VERSION: ${{ needs.release-preparation.outputs.version }}
          COMMIT: ${{ needs.release-preparation.outputs.commit }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.tmpl" << 'EOF'
          # MD2HTML ${VERSION}

          ## 🚀 What's New

          ${CHANGES}

          Every commit: the [history up to ${VERSION}](https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION});
          every version: `CHANGELOG.md` in the repository and in each download.

          ## 📦 Downloads

          Each platform ships as a **one-download ZIP bundle** containing
          the `md2html` binary plus both licence texts, README, and CHANGELOG.
          Individual raw binaries are also attached for automation that
          `wget`s a single file.

          ### 🟦 Windows x86_64
          - **`md2html-windows-x64.zip`** - recommended.
          - Raw binary: `md2html-windows-x64.exe`.

          ### 🍏 macOS
          - **`md2html-macos-arm64.zip`** (Apple silicon) and
            **`md2html-macos-x64.zip`** (Intel) - recommended.
          - Raw binaries: `md2html-macos-arm64`, `md2html-macos-x64`.

          ### 🐧 Linux x86_64 (static musl)
          - **`md2html-linux-x64.zip`** - recommended.
          - Raw binary: `md2html-linux-x64` (fully static; runs on any Linux
            including old LTS, WSL, and Alpine).

          ## 🔐 Verification

          All binaries are accompanied by SHA256 checksums in `CHECKSUMS.txt`
          (and `SHA256SUMS`, a conventionally-named copy).  Verify with:
          ```bash
          sha256sum -c CHECKSUMS.txt
          ```

          Additionally, when the repository's SLSA lane is enabled, every
          release asset carries a **SLSA build-provenance attestation**
          signed with the workflow's Sigstore OIDC identity.  Verify with
          GitHub CLI:
          ```bash
          gh attestation verify <file> --owner ${OWNER}
          ```
          A successful verification proves the bytes were produced by
          this exact workflow run on this exact commit.

          ### 📋 SBOM (Software Bill of Materials)

          Each workspace crate ships a CycloneDX 1.5 SBOM alongside the
          binaries: `sbom-<crate>.cdx.json`.  The SBOMs are covered by
          the same SLSA attestation as the binaries, so you can verify
          the inventory with the same command above.  Inspect with any
          CycloneDX-aware tool, e.g.:
          ```bash
          jq '.components[] | {name, version, purl}' sbom-md2html.cdx.json
          ```

          ## 📋 Installation

          ### Recommended: ZIP bundle
          1. Download `md2html-<platform>.zip` for your platform.
          2. Unzip anywhere.
          3. **Windows**: the `.exe` is ready to run; place it on `PATH`.
          4. **macOS**: move the `md2html` binary into `/usr/local/bin/`.  Builds signed with a Developer ID and notarized launch without a prompt; for an ad-hoc build Gatekeeper warns on first launch - right-click → Open to confirm, or run `xattr -d com.apple.quarantine md2html`.
          5. **Linux**: `chmod +x md2html` then move it onto `PATH` (e.g. `/usr/local/bin/`).

          ### Raw-binary path (automation)
          - Download the individual binary, e.g. `md2html-linux-x64`.
          - macOS / Linux: `chmod +x md2html-*` then optionally `mv md2html-* /usr/local/bin/md2html`.
          - Windows: the `.exe` is ready to run; place it on `PATH`.

          ## 🛠️ Build Information

          - **Triggered by**: ${TRIGGERED_BY}
          - **Commit**: ${COMMIT}
          - **Toolchain**: pinned nightly from `rust-toolchain.toml`
          - **Profile**: `[profile.release]` - LTO=fat, codegen-units=1, strip=symbols
          - **CPU baselines**: x86_64 = `x86-64-v3` (Haswell+/Zen+); macOS ARM64 = `apple-m1` (M1+)

          ---

          **Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}
          EOF
          # The release's own section of the changelog; none is an error:
          # a release is never published without its notes.
          CHANGES="$(python3 scripts/ci/versions.py notes "${VERSION#v}")"
          export CHANGES
          # One pass over the template (Python's string.Template, as
          # envsubst would): a value that holds `${...}` stays as it is.
          python3 -c 'import os, string, sys
          names = sys.argv[2:]
          text = open(sys.argv[1], encoding="utf-8").read()
          sys.stdout.write(string.Template(text).safe_substitute({n: os.environ[n] for n in names}))' \
            "$RUNNER_TEMP/release-notes.tmpl" VERSION TRIGGERED_BY COMMIT OWNER GITHUB_REPOSITORY CHANGES \
            > release-notes.md

      - name: Create GitHub Release (on the signed tag)
        # No `--target`: the release names the signed tag the owner pushed
        # (`just release-tag`), which `release-preparation` checked names
        # the built commit; this workflow makes no tag of its own.  (A
        # release with a commit-SHA target would make the tag itself, and
        # GITHUB_TOKEN is refused that: cli/cli#9514.)  `gh` is
        # on every runner, so no third-party action is needed: the notes
        # from the step above come first, GitHub's generated notes follow
        # them (`--generate-notes`), and `--title` names the release.
        env:
          # The public releases-only repository when the RELEASE_REPO
          # variable names one (a private product repo cannot serve its
          # release assets to install scripts, Homebrew or winget). Empty
          # = this repository. RELEASE_REPO_TOKEN is a fine-grained PAT
          # with contents: write on that one repository.
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
          TAG: ${{ needs.release-preparation.outputs.tag }}
          RELEASE_NAME: ${{ needs.release-preparation.outputs.release-name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" final-release/* \
            --repo "$RELEASE_REPO" \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --generate-notes

      - name: Create release summary
        shell: bash
        env:
          VERSION: ${{ needs.release-preparation.outputs.version }}
          TAG: ${{ needs.release-preparation.outputs.tag }}
          COMMIT: ${{ needs.release-preparation.outputs.commit }}
        run: |
          # Single grouped redirect into $GITHUB_STEP_SUMMARY (SC2129),
          # with the variable quoted to survive any future path with
          # spaces in the runner-tmp directory (SC2086).
          {
            echo "## 🎉 Release ${VERSION} Created!"
            echo ""
            echo "### 📦 Release Details:"
            echo "- **Version**: ${VERSION}"
            echo "- **Tag**: ${TAG}"
            echo "- **Triggered by**: ${TRIGGERED_BY}"
            echo "- **Commit**: ${COMMIT}"
            echo ""
            echo "### 🚀 Artifacts Built:"
            echo "- ✅ Windows x86_64"
            echo "- ✅ macOS ARM64"
            echo "- ✅ macOS x86_64"
            echo "- ✅ Linux x86_64 (static musl)"
            echo ""
            echo "### 🔗 Links:"
            echo "- [📦 Release Page](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo "- [📋 Full Changelog](https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # WinGet submission - dispatch winget-publish.yml after the release lands
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Why dispatch instead of relying on `on: release` in winget-publish.yml:
  # the Release above is created with the default GITHUB_TOKEN, and GitHub
  # suppresses event cascades from GITHUB_TOKEN-authored actions - so a
  # `release: released` trigger would never fire.  Triggering another
  # workflow via `gh workflow run` (workflow_dispatch) IS a permitted
  # GITHUB_TOKEN action, so this is the robust path.
  #
  # The job is outside every other job's `needs:` graph, so a failed
  # dispatch cannot roll back the release (it is already published); it
  # does fail the workflow, and ci-failure-notify files the issue: a
  # package-manager update that silently did not happen is a failure.
  submit-winget:
    name: 📦 Submit to WinGet
    runs-on: ubuntu-latest
    needs: [release-preparation, create-github-release]
    # Dormancy guards: needs BOTH the release lane and the winget lane
    # enabled, plus the canonical-repo check.
    if: vars.LANE_RELEASE == 'true' && vars.LANE_WINGET == 'true' && github.repository_owner == 'githubrobbi'
    permissions:
      actions: write # required to dispatch winget-publish.yml via the API
    timeout-minutes: 5
    steps:
      - name: Dispatch winget-publish workflow for the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-preparation.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching winget-publish.yml for ${RELEASE_TAG}"
          # Dispatch against the repo's default branch: `gh workflow run
          # --ref` resolves the workflow definition from that ref, and
          # winget-publish.yml always lives on the default branch.  Using
          # the default branch (not github.ref_name, which is the tag on a
          # `push: tags: v*` run) keeps the dispatch ref stable.
          default_branch="$(gh repo view "${GH_REPO}" --json defaultBranchRef -q .defaultBranchRef.name)"
          gh workflow run winget-publish.yml \
            --ref "${default_branch}" \
            -f "release-tag=${RELEASE_TAG}"
          echo "✅ winget-publish.yml dispatched for ${RELEASE_TAG} on ${default_branch} (runs independently; check the Actions tab)."

  # ═══════════════════════════════════════════════════════════════════════════
  # Homebrew (lane:brew) - dispatch brew-publish.yml for the release tag
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Same shape as submit-winget: the release is created by GITHUB_TOKEN,
  # whose events never start another workflow, so the tap update is
  # dispatched explicitly. Dormant until LANE_BREW=true (docs/forge/COMPONENTS.md).
  submit-brew:
    name: 🍺 Dispatch Homebrew tap update
    runs-on: ubuntu-latest
    needs: [release-preparation, create-github-release]
    if: vars.LANE_RELEASE == 'true' && vars.LANE_BREW == 'true' && github.repository_owner == 'githubrobbi'
    permissions:
      actions: write # required to dispatch brew-publish.yml via the API
    timeout-minutes: 5
    steps:
      - name: Dispatch brew-publish workflow for the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-preparation.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "${GH_REPO}" --json defaultBranchRef -q .defaultBranchRef.name)"
          gh workflow run brew-publish.yml --ref "${default_branch}" -f "release-tag=${RELEASE_TAG}"
          echo "✅ brew-publish.yml dispatched for ${RELEASE_TAG} (runs independently)."

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish crates.io - dispatch release-plz.yml's OIDC crates-io-publish job
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # crates.io gets a version only once its release exists: release-plz.yml has
  # no tag trigger of its own (the owner's tag push would otherwise publish
  # before anything is built, and past the signature check above), so the
  # crates publish is dispatched here, exactly like submit-winget above.
  # Dispatching against the default branch keeps the dispatch ref stable; the
  # tag is passed as `publish_tag`, and release-plz.yml checks out that tag and
  # publishes it via OIDC trusted publishing (registration: workflow
  # release-plz.yml + environment crates.io-publish - unchanged by this job).
  submit-crates:
    name: 📦 Publish crates.io (OIDC)
    runs-on: ubuntu-latest
    needs: [release-preparation, create-github-release]
    # Dormancy guards: the release lane AND lane:crates-publish
    # (docs/forge/COMPONENTS.md), plus the canonical-repo check.
    if: vars.LANE_RELEASE == 'true' && vars.LANE_CRATES == 'true' && github.repository_owner == 'githubrobbi'
    permissions:
      actions: write # required to dispatch release-plz.yml via the API
    timeout-minutes: 5
    steps:
      - name: Dispatch release-plz crates-io-publish for the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-preparation.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "${GH_REPO}" --json defaultBranchRef -q .defaultBranchRef.name)"
          echo "Dispatching release-plz.yml crates-io-publish for ${RELEASE_TAG}"
          gh workflow run release-plz.yml \
            --ref "${default_branch}" \
            -f "publish_tag=${RELEASE_TAG}"
          echo "✅ release-plz.yml dispatched for ${RELEASE_TAG} (crates publish runs independently; check the Actions tab)."

  # ═══════════════════════════════════════════════════════════════════════════
  # Failure Notification - opens a GitHub Issue on release failure
  # ═══════════════════════════════════════════════════════════════════════════

  notify-failure:
    name: 🔔 Notify on Failure
    runs-on: ubuntu-latest
    needs: [release-preparation, build-release-binaries, create-github-release]
    # Dormancy guard (see release-preparation), composed with the
    # existing failure() condition.
    if: vars.LANE_RELEASE == 'true' && failure()
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Per-workflow label so Release / Tier 1 / Tier 2 failures
            // triage to distinct issues instead of piling onto one.
            const label = 'ci-failure-release';
            const title = `🔴 Release Pipeline Failed - ${context.sha.substring(0, 7)}`;
            const body = [
              `## Release Pipeline Failed`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Workflow** | \`${context.workflow}\` |`,
              `| **Run** | [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
              `| **Branch** | \`${context.ref}\` |`,
              `| **Commit** | [\`${context.sha.substring(0, 7)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) |`,
              `| **Triggered by** | @${context.actor} |`,
              ``,
              `⚠️ **This is a release pipeline failure - immediate attention required.**`,
              ``,
              `📧 Failure mail: the CI Failure Notify workflow files the issue and mails md2htmlfailed@nios.net`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: body,
              });
              core.info(`Updated existing issue #${existing.data[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label, 'ci-failure'],
                assignees: ['githubrobbi'],
              });
              core.info('Created new failure issue');
            }
