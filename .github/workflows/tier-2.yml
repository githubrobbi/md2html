# md2html Tier 2 weekly CI
# Copyright (c) 2025-2026 Sky, LLC.
# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Tier 2 keeps the slower nightly checks out of the PR path while still
# exercising the important scheduled/on-demand validation gates.

name: 🌙 MD2HTML Tier 2 Nightly CI

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Workflow-level permissions follow least-privilege (§2.8):
# every job that doesn't declare its own `permissions:` block
# inherits `contents: read` only.  Failure notification has been
# moved out of this workflow into `.github/workflows/ci-failure-notify.yml`
# (Design C for #209), so no in-workflow job needs `issues: write`
# anymore.
permissions:
  contents: read

# Tier 2 runs on a weekly cron; a manual `workflow_dispatch` landing
# on top of a cron run should queue, not cancel - we want the full
# Miri / coverage report to complete.  Keyed the same way as the
# other workflows in this repo so GitHub's concurrency UI stays
# consistent across the pipeline.
concurrency:
  group: tier-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: target
  # Disable sccache in CI - it's configured in .cargo/config.toml for local dev
  # but not installed on GitHub Actions runners
  RUSTC_WRAPPER: ""
  # Limit parallel jobs to bound memory pressure during compile/link.
  # GitHub Actions ubuntu-latest runners (16 GB / 4 vCPU) can get
  # pre-empted (exit 143 / SIGTERM) when several heavy link stages run
  # in parallel, so this serialises the build.  Wall time goes up
  # modestly but stays well within the step budgets; correctness >
  # speed for a once-weekly cron.  Raise (or drop) this cap if the
  # workspace's dependency graph stays lean enough to link in parallel.
  CARGO_BUILD_JOBS: 1

jobs:
  file-size-policy:
    name: Tier 2 / File Size Policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce file size policy
        run: bash scripts/ci/check_file_size_policy.sh

  coverage:
    name: Tier 2 / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space for coverage instrumentation builds..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tier-2-coverage
          cache-on-failure: 'true'

      - name: Install tools
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage report
        # --locked per §2.8 policy; the release-profile cargo also
        # resolves through the committed Cargo.lock, so coverage
        # reports reflect exactly the versions that CI / local
        # development use.
        run: cargo llvm-cov nextest --locked --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        # lane:codecov (docs/forge/COMPONENTS.md): dormant until
        # LANE_CODECOV=true.  Once on, a failed upload fails the job - an
        # upload that may silently not happen is not a lane.
        if: vars.LANE_CODECOV == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          # Explicit slug so the uploader doesn't have to infer the repo
          # from GitHub Actions env vars (more robust on fork PRs, workflow
          # renames, etc.).  Recommended by the Codecov setup wizard.
          slug: githubrobbi/md2html
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  # ══════════════════════════════════════════════════════════════════════════
  # Tier 2 / Windows Compile Check - intentionally absent.
  #
  # `pr-fast.yml::windows-lint` runs `cargo clippy --workspace
  # --all-targets --all-features --locked --no-deps -- -D warnings`
  # natively on `windows-latest` on EVERY PR.  `cargo clippy` does a
  # full type-check + executes every dep's `build.rs`, so any
  # platform-specific build regression a weekly `cargo check` here
  # would catch is already caught at PR-time - minutes after the bad
  # commit lands on the PR branch instead of up to 7 days later.
  # Strict clippy on top is a bonus.  Tier 2 stays as the
  # deep-assurance lane for things genuinely too expensive for
  # PR-time: coverage, miri, udeps.

  build-validation:
    name: Tier 2 / Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tier-2-build-validation
          cache-on-failure: 'true'

      - name: Run build validation
        # --locked per §2.8 - validation builds must resolve through
        # the committed Cargo.lock, otherwise a broken lockfile wouldn't
        # surface here.
        #
        # CARGO_BUILD_JOBS=1: workflow-level env already sets this; the
        # step-level override is kept in lockstep so a future split
        # of the workflow-level cap doesn't silently re-introduce
        # parallel linking.  GitHub Actions step-env > workflow-env,
        # so divergence here would defeat the fix.
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo build --locked --workspace --all-features --bins

  udeps:
    name: Tier 2 / cargo-udeps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tier-2-udeps
          cache-on-failure: 'true'

      - name: Install cargo-udeps
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # Pinned, not "latest": install-action's manifest lags the
          # releases, and a lagging cargo-udeps embeds an older libcargo
          # that can resolve a lockfile differently from the driving
          # cargo. Bump
          # deliberately, together with `just tier2-local`'s hint.
          tool: cargo-udeps@0.1.61

      - name: Pre-fetch dependencies with the driving cargo
        # cargo-udeps embeds its own libcargo; handing it a cache the
        # driving cargo already fetched and validated (instead of
        # letting it build its own on a cold runner) removes the one
        # class of divergence between "passes locally" and "fails here".
        run: cargo fetch --locked

      - name: Run cargo-udeps
        # --locked per §2.8; cargo-udeps resolves through the same
        # lockfile as the rest of the workspace.
        run: cargo udeps --locked --workspace --all-targets --all-features

  # ══════════════════════════════════════════════════════════════════════════
  # Tier 2 / cargo-hack feature matrix
  #
  # Iterates every feature-bearing crate's `[features]` permutations and
  # runs `cargo check --all-targets --locked` for each one.  Catches the
  # class of bug where new code adds `use <crate-behind-feature>` without
  # `#[cfg(feature = "...")]` gating - `--all-features` is blind to it
  # because the feature is always on in that mode; cargo-hack is the
  # static guarantee that single-feature builds still compile.
  #
  # `--keep-going` reports every failing permutation in one run so a
  # single fix-pass catches every gap, instead of having to re-run
  # cargo-hack N times to discover them one at a time.
  hack:
    name: Tier 2 / cargo-hack feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tier-2-hack
          cache-on-failure: 'true'

      - name: Install cargo-hack
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-hack

      - name: Run cargo-hack --each-feature
        # --locked per §2.8 so the matrix resolves through the same
        # lockfile as the rest of the workspace.
        # --workspace iterates every member.
        # --each-feature: for each member with a [features] block, run
        #   the command once per feature in isolation (plus once with
        #   --no-default-features and once with default features).
        # --keep-going: report every failing permutation, not just the
        #   first - needed for actionable fix-passes.
        # check --all-targets: type-check including tests / benches /
        #   examples.  Faster than clippy and sufficient to catch the
        #   class of feature-flag bug this gate exists for; strict
        #   clippy runs separately under --all-features in pr-fast.
        run: |
          cargo hack \
            --workspace \
            --each-feature \
            --keep-going \
            check --all-targets --locked

  miri:
    name: Tier 2 / Miri
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tier-2-miri
          cache-on-failure: 'true'

      - name: Run Miri (md2html, the parsing and text modules)
        env:
          # Isolation disabled so tests that touch the real filesystem /
          # clock can run under Miri.  Drop this if no test needs it.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          # --locked per §2.8 so miri evaluates the same resolved crate
          # graph as the rest of the workspace.
          #
          # Miri interprets every instruction, so it is orders of magnitude
          # slower than a native test run.  md2html's whole suite does not
          # finish under it: the diagram layout and the page-rendering
          # tests include pathological inputs sized for native speed (25
          # of 79 tests took six minutes locally, then the hostile-flowchart
          # test did not end).  So Miri runs the unit tests of the modules
          # that read and rewrite untrusted text; md2html forbids unsafe
          # code, so what Miri can still find here is in the standard
          # library's own unsafe code as these modules drive it.
          #
          # The filter words are libtest substring filters (a test runs when
          # its full name contains any of them).  They select the unit tests
          # of block, config, export (book, images, xhtml, zip; not print,
          # which starts Chrome), highlight, inline, math, sanitize, scan and
          # text, with their submodules (`config::front::tests`,
          # `sanitize::markup::tests`, `text::sha256::tests`, ...), and none
          # of `tests::*` (whole pages), `mermaid`, `serve`, `watch` or
          # `cli`.  95 of 187 tests on 2026-11-23.  To keep it current, run
          # `cargo test -p md2html -- --list` and check that every word
          # still matches a test, that every test module of these files is
          # selected, and that no excluded one is: a module that gains a
          # test file, or a renamed one, changes the list.
          cargo miri test --locked -p md2html -- \
            block:: config:: export::book:: export::images:: export::xhtml:: \
            export::zip:: highlight:: inline:: math:: sanitize:: scan:: text::

  # ───────────────────────────────────────────────────────────────────
  # cargo-careful - broad std-debug-assertion coverage that complements
  # Miri's narrow deep-dive
  #
  # `cargo-careful` rebuilds the standard library with extra debug
  # assertions enabled (slice / iterator / integer-overflow checks that
  # the regular debug build glosses over) and runs the workspace tests
  # against that augmented std.  Catches UB in std-using code paths
  # that Miri can't reach because Miri is too slow for the broad test
  # surface - Miri stays focused on the narrow deep-dive above;
  # `careful` widens the lens to every test in the workspace.
  #
  # Why `--workspace` (not a per-crate scope):
  #
  #   The workspace is small and contains no `unsafe` code today, so a
  #   full-workspace run is cheap and gives blanket coverage.  If the
  #   project grows crates with substantial `unsafe` density (raw
  #   pointer / byte-slice manipulation, FFI boundaries), narrow this
  #   to `-p <crate>` invocations targeting those crates to keep the
  #   `-Zbuild-std` rebuild + test runtime bounded.
  #
  # Why `--all-features` is OMITTED:
  #
  #   The default feature set is what production binaries ship; that
  #   is what we want to harden.  Non-default features are exercised
  #   by `tier-2.yml::hack` under cargo-hack and don't need duplicate
  #   UB-detection coverage here.
  #
  # See `docs/policies/lint-posture.md`, "The weekly checks".
  careful:
    name: Tier 2 / cargo-careful
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free up disk space
        # Same prelude as miri - std rebuild plus per-crate test
        # compile produces several GB of artifacts and the
        # ubuntu-latest runner image ships with only ~14 GB free
        # after the default toolchain install.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        # `rust-toolchain.toml` already pins a known-good nightly
        # plus `rust-src` (needed for `-Zbuild-std` which cargo-
        # careful uses internally).  `rustup show` installs the
        # pinned channel + components.
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Dedicated cache key - cargo-careful's `-Zbuild-std`
          # rebuild produces a distinct sysroot / target-dir layout
          # from the regular workspace build, so sharing miri's
          # cache key would invalidate one or both on each run.
          shared-key: tier-2-careful
          cache-on-failure: 'true'

      - name: Install cargo-careful
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-careful

      - name: Run cargo-careful test (workspace)
        # `cargo careful test` internally invokes `cargo +nightly
        # test -Zbuild-std=std,panic_abort
        #   -Zbuild-std-features=debug-refcell,debug-assertions,...`
        # producing a std with substantially more runtime checks.
        # The augmented std catches:
        #   - slice/iterator bounds violations (Vec::get_unchecked
        #     misuse, etc.)
        #   - integer overflow on operations the regular debug build
        #     glosses over (mostly Pow* / shr / cast paths)
        #   - misuse of `RefCell` borrow rules in cases regular
        #     `RefCell::borrow*` panics miss
        #   - some `slice::from_raw_parts` invariant violations
        # - none of which a regular `cargo test` will flag, and many
        # of which Miri can't reach because Miri's interpretation
        # cost limits it to narrow test scopes (see the miri job
        # above).
        #
        # `--locked` per §2.8 so the same resolved crate graph as the
        # rest of the workspace is used.
        run: cargo careful test --locked --workspace

  # ───────────────────────────────────────────────────────────────────
  # cargo-mutants - test-suite quality measurement on safety-critical
  # paths
  #
  # `cargo-mutants` programmatically generates small source-code
  # mutations (operator swaps, value flips, return-value substitutions,
  # etc.) and runs the full test suite against each mutant.  The
  # signal is:
  #
  #   * **caught** - at least one test failed with the mutation in
  #     place → the test suite genuinely exercises the mutated code
  #     path.  Good.
  #   * **missed** - all tests still passed with the mutation in
  #     place → either the mutated code is dead, or there's a test
  #     gap.  Bad (or at least: worth a human look).
  #   * **timeout** - the mutated program looped forever; the
  #     per-mutant timeout (configured in `mutants.toml` at repo
  #     root) bounded the runtime.  Treated like "caught" since the
  #     mutation produced a behaviour the tests rejected.
  #
  # Why scoped to the sanitizer and the text helpers (and not the crate, or `--workspace`):
  #
  #   `cargo-mutants` is O(mutations × test-suite-runtime), so it is
  #   the most expensive gate in this workflow per line of code it
  #   covers.  All of md2html is thousands of mutants, hours past this
  #   job's budget.  The sanitizer and the text helpers (`sanitize.rs`,
  #   `sanitize/`, `text.rs`, `text/`: 381 mutants on 2026-11-23, about
  #   4 minutes on 6 cores) are where a gap in the tests costs most:
  #   they decide which HTML and which links from untrusted Markdown
  #   reach the page.  Widen the `-f` list module by module, each one
  #   once its tests catch every mutant, keeping an eye on the weekly
  #   runtime budget.
  #
  # Why `ubuntu-22.04`:
  #
  #   The workspace has no platform-gated code, so Linux runners give
  #   the same mutation coverage as any other OS at the lowest $/min.
  #   If a crate ever grows `#[cfg(windows)]`-gated logic whose tests
  #   only compile on Windows, mutations inside it would show up as
  #   structural false-negative MISSES on Linux - at that point move
  #   (or matrix) this job onto the platform that compiles the tests.
  #
  # A required check: every mutant in scope is caught (2026-11-23: 362
  # caught, 14 unviable, 5 timed out, 0 missed), so one escaped mutant
  # is a test gap, and the job fails on it.
  #
  # See `docs/policies/lint-posture.md`, "The weekly checks".
  mutants:
    name: Tier 2 / cargo-mutants (md2html)
    # ubuntu-24.04 EXPLICITLY, not ubuntu-latest and not ubuntu-22.04:
    # the prebuilt cargo-mutants that install-action fetches is linked
    # against GLIBC_2.39, which 22.04 (glibc 2.35) does not have, so
    # the job dies with "libc.so.6: version `GLIBC_2.39' not found"
    # before running a single mutant. `ubuntu-latest` is a pool
    # request, not a guarantee, and has served a 22.04 image for that
    # label. A rerun cannot heal it - it is the image, not a flake -
    # so the image is PINNED.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Dedicated cache key - cargo-mutants does many short
          # per-mutant rebuilds and benefits from its own cache so
          # the regular workspace builds don't evict mutation-test
          # artifacts (and vice-versa).
          shared-key: tier-2-mutants
          cache-on-failure: 'true'

      - name: Install cargo-mutants
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants

      - name: Run cargo-mutants on md2html (sanitizer, text helpers)
        # `--jobs 4` matches the runner's 4-core capacity.
        # `--no-shuffle` gives deterministic mutant ordering, which
        # is useful when comparing successive runs.
        # `.cargo/mutants.toml` supplies `additional_cargo_args =
        # ["--locked"]`, `timeout_multiplier = 2.0`, and exclusion
        # globs / regexes - see that file for justification of each.
        # (The file lived at the repo root until 2026-09, a path
        # cargo-mutants never reads - none of its policy had ever
        # applied in CI.)
        run: |
          set +e
          cargo mutants \
            --package md2html \
            -f 'crates/md2html/src/sanitize.rs' \
            -f 'crates/md2html/src/sanitize/*.rs' \
            -f 'crates/md2html/src/text.rs' \
            -f 'crates/md2html/src/text/*.rs' \
            --jobs 4 \
            --no-shuffle
          status=$?
          set -e
          # The exit code cannot gate alone: cargo-mutants exits 3
          # whenever ANY mutant timed out - even beside genuine
          # misses. And a TIMED-OUT mutant is a DETECTED mutant: an
          # infinite-loop mutation that hangs the suite cannot ship
          # unnoticed; the timeout is the kill. missed.txt is the
          # precise verdict - fail iff a mutant truly escaped, and
          # still fail on any status that is not the timeouts-only 3.
          if [ -s mutants.out/missed.txt ]; then
            echo "missed mutants:"
            cat mutants.out/missed.txt
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

      - name: Upload mutants.out artifact
        # Keep the directory for 30 days so triage on missed
        # mutations can happen offline.  `mutants.out/` contains a
        # per-mutant diff, log, and overall summary in
        # `outcomes.json`.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-mutants-output-${{ github.run_id }}
          path: mutants.out/
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────
  # Generated documents - the corpus of the differential test rendered
  # in six ways, judged on its own
  #
  # scripts/differential/corpus.py writes 8,300 Markdown files: the
  # repository's own, the CommonMark examples, and seeded mutations of
  # both (the grammar's edges put in, blocks of diagrams, code, maths and
  # tables mutated alone, broken UTF-8). compare.py renders each as a
  # page, with --html --embed --csp, as a fragment, with most options, with
  # --check and as an EPUB, and fails when one makes md2html panic, end
  # by a signal or run past three minutes. It is the bounded fuzzing of
  # a program that has no dependencies to fuzz with: the same files every
  # week, so a failure reproduces with `just generated-documents`. The
  # byte-for-byte comparison with another build is `just differential`,
  # run before a pull request that touches rendering (docs/TESTING.md).
  # ───────────────────────────────────────────────────────────────────
  generated-documents:
    name: Tier 2 / Generated documents
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly (from rust-toolchain.toml)
        run: rustup show

      - name: Build md2html (release)
        run: cargo build --release --locked -p md2html

      - name: Write the corpus
        run: python3 scripts/differential/corpus.py target/differential/corpus

      - name: Render it; no file may crash md2html or run out of time
        run: python3 scripts/differential/compare.py --jobs 4 --new target/release/md2html target/differential/corpus

  # ───────────────────────────────────────────────────────────────────
  # MSRV verification is not here: md2html's `rust-version` (in
  # crates/md2html/Cargo.toml) is built on every pull request by the
  # `msrv` job of ci.yml, a required check.
  # ───────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────
  # cargo-fuzz - intentionally absent (for now).
  #
  # md2html IS a parser of untrusted text (Markdown in, HTML out), so it
  # is a real fuzzing surface; no harness exists yet.  Fuzzing arrives
  # via the fuzz-target component recipe (docs/forge/COMPONENTS.md):
  # libfuzzer-sys harnesses under `crates/md2html/fuzz/`, then a
  # time-budgeted `cargo fuzz run <target> -- -max_total_time=900` job
  # here that fails on a crash like every other job.
  # ───────────────────────────────────────────────────────────────────

  tier-2-summary:
    name: Tier 2 / Summary
    runs-on: ubuntu-latest
    needs: [file-size-policy, coverage, build-validation, udeps, hack, miri, careful, mutants, generated-documents]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check pipeline success
        # Every job is required, mutation testing included.
        run: |
          if [[ "${{ needs.file-size-policy.result }}" == "success" && \
                "${{ needs.coverage.result }}" == "success" && \
                "${{ needs.build-validation.result }}" == "success" && \
                "${{ needs.udeps.result }}" == "success" && \
                "${{ needs.hack.result }}" == "success" && \
                "${{ needs.miri.result }}" == "success" && \
                "${{ needs.careful.result }}" == "success" && \
                "${{ needs.mutants.result }}" == "success" && \
                "${{ needs.generated-documents.result }}" == "success" ]]; then
            echo "✅ All Tier 2 nightly checks passed!"
          else
            echo "❌ Some Tier 2 nightly checks failed - review above"
            exit 1
          fi

      - name: Create summary
        if: success()
        # Single grouped redirect (SC2129) with the env-var quoted (SC2086)
        # - one pipe to the GITHUB_STEP_SUMMARY file instead of nine, and
        # safe against word-splitting if `$GITHUB_STEP_SUMMARY` ever
        # contains a space (it doesn't on hosted runners today, but
        # quoting is the defensible default).
        # It runs only when every job succeeded, mutation testing
        # included, so every row is a pass.
        run: |
          {
              echo "## ✅ MD2HTML Tier 2 Nightly CI Passed"
              echo ""
              echo "| Check | Status |"
              echo "|-------|--------|"
              echo "| File size policy | ✅ |"
              echo "| Coverage | ✅ |"
              echo "| Build validation | ✅ |"
              echo "| cargo-udeps | ✅ |"
              echo "| cargo-hack feature matrix | ✅ |"
              echo "| Miri | ✅ |"
              echo "| cargo-careful | ✅ |"
              echo "| cargo-mutants (md2html) | ✅ |"
              echo "| Generated documents | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # Failure Notification has been moved out of this workflow into
  # `.github/workflows/ci-failure-notify.yml` (Design C for #209).
  # That workflow triggers off `workflow_run [completed]` AFTER
  # `auto-rerun-transient.yml` has had its 60-second window to retry
  # transient flakes, so this Tier 2 nightly no longer self-files
  # false-positive `ci-failure-tier-2` issues for transient HTTP 429
  # / network blips / runner-setup faults.
  #
  # Every job of this workflow is required, so any failure, a missed
  # mutant included, makes the run's conclusion `failure`, and
  # `ci-failure-notify.yml` files an issue for it.
  # ═══════════════════════════════════════════════════════════════════════════