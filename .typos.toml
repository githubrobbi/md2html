#
# typos-cli configuration for the MD2HTML workspace.
#
# Invoked by the pre-commit / pre-push hooks and by `just typos`.  Each
# `extend-words` entry below is a real English word, technical term, or
# crate name the default typos dictionary mis-flags; next time we bump
# typos-cli we should re-audit this list to drop upstream-caught terms.
#
# Docs: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[default.extend-words]
# The template starts with only the words its own scaffolding prose needs;
# add project jargon, acronyms, and intentional fragments as typos flags them.
invokable = "invokable"     # scaffolding docs: "locally invokable" gate
unparseable = "unparseable" # accepted variant spelling in pipeline/gate docs
mis = "mis"                 # "mis-classifying" hyphenated prefix in gen-workflow docs
hom = "hom"                 # TeX \hom (md2html's maths)
oint = "oint"               # TeX \oint
opf = "opf"                 # the EPUB package file, OEBPS/package.opf
lage = "lage"               # German, in a slug test ("Die Lage")

[files]
# Frozen / historical / third-party-metadata locations - not subject
# to spelling review.
extend-exclude = [
  "CHANGELOG.md",                     # historical release notes
  "LOG/",                             # timestamped changelogs
  "supply-chain/",                    # cargo-vet metadata keyed by real crate names
  "tests/fixtures/",                  # frozen test fixtures
  "target/",                          # build artefacts
  ".git/",                            # git internals
  "crates/md2html/tests/commonmark/", # the CommonMark specification's examples, verbatim
  "docs/*.*.md",                      # the translations: seventeen languages, not misspelled English
  "crates/md2html/src/config.rs",     # the interface words in seventeen languages
  "crates/md2html/src/tests.rs",      # attack strings and German test text, on purpose
]
