# md2html: Markdown to one self-contained HTML page.
# Forked from iv's `iv-handbook`. Standard library only, so it builds on
# macOS and Ubuntu with nothing but a Rust toolchain (1.85 or newer, for
# edition 2024).

[package]
name = "md2html"
version = "0.7.4"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Robert S.A. Nio"]
description = "Markdown to one self-contained, offline HTML page: outline, search, themes, glossary, figures, maths and code colour, from the standard library alone"
keywords = ["markdown", "html", "commonmark", "static-site", "documentation"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/githubrobbi/md2html"
readme = "README.md"
publish = false

[[bin]]
name = "md2html"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A renderer's dispatch over block and inline kinds reads best as one long
# match; settings are naturally a handful of flags.
too_many_lines = "allow"
struct_excessive_bools = "allow"
many_single_char_names = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
