version = 1

# Default: all files in the repository are dual-licensed MIT OR Apache-2.0
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025-2026 Sky, LLC."
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The CommonMark specification's examples, which the conformance test reads:
# the specification's own text, under its own licence.
[[annotations]]
path = "crates/md2html/tests/commonmark/**"
precedence = "override"
SPDX-FileCopyrightText = "2014-2024 John MacFarlane"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# HTML's named character references, the WHATWG's list
# (https://html.spec.whatwg.org/entities.json), vendored unchanged as the
# input of scripts/gen_entities.py: the HTML Standard's own data, under its
# own licence.
[[annotations]]
path = "scripts/entities/entities.json"
precedence = "override"
SPDX-FileCopyrightText = "WHATWG (Apple, Google, Mozilla, Microsoft)"
SPDX-License-Identifier = "CC-BY-4.0"

# The Unicode Character Database's general categories
# (https://www.unicode.org/Public/16.0.0/ucd/extracted/DerivedGeneralCategory.txt),
# vendored unchanged as the input of scripts/gen_word.py: Unicode's own
# data, under its own licence.
[[annotations]]
path = "scripts/unicode/DerivedGeneralCategory.txt"
precedence = "override"
SPDX-FileCopyrightText = "1991-2024 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# The notice that ships with md2html: its own licence and the WHATWG's
# BSD 3-Clause notice for the table of named character references.
[[annotations]]
path = "NOTICE"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Sky, LLC",
  "WHATWG (Apple, Google, Mozilla, Microsoft)",
  "1991-2024 Unicode, Inc.",
]
SPDX-License-Identifier = "(MIT OR Apache-2.0) AND BSD-3-Clause AND Unicode-3.0"
