#
# Clippy settings that cannot be set in `[workspace.lints]` of the root
# `Cargo.toml`. Every crate of the workspace reads this file.
#
# The rule of this workspace: a lint finding is fixed, not silenced. There
# are no `#[allow]` or `#[expect]` attributes in the code, and nothing
# here exempts code from a lint either. What is here says where a lint
# applies (tests are allowed to fail loudly) and tightens the defaults.

# ── Tests fail loudly ─────────────────────────────────────────────────────────
# A test that hits an unexpected state should stop with the reason, so
# `unwrap`, `expect` and `panic!` are how a test says "this must hold".
# Production code returns errors instead (`unwrap_used`, `expect_used` and
# `panic` are denied for it). Debugging leftovers are not allowed in tests
# either: no `dbg!`, no printing.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = false
allow-print-in-tests = false

# ── No published library ──────────────────────────────────────────────────────
# Nothing outside this workspace uses its items, so Clippy may suggest
# changes that would break an outside caller.
avoid-breaking-exported-api = false

# ── Documentation sections ────────────────────────────────────────────────────
# `missing_errors_doc` and `missing_panics_doc` ask public functions for
# `# Errors` and `# Panics` sections. Private items are documented by the
# `missing_docs_in_private_items` lint (every item has a doc comment); the
# sections are not asked of them.
check-private-items = false

# ── Restriction lints in constant evaluation too ──────────────────────────────
# `indexing_slicing` and the other restriction lints apply in `const`
# contexts as everywhere else.
suppress-restriction-lint-in-const = false

# ── Struct initialisers in declaration order ──────────────────────────────────
check-inconsistent-struct-field-initializers = true

# ── Size of a file included in a binary ───────────────────────────────────────
# Companion of `large_include_file = "deny"`: the largest file the product
# embeds is its page script and stylesheet, far below this.
max-include-file-size = 200_000
