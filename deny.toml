# cargo-deny: what md2html may depend on. Today that is nothing: the crate uses the
# standard library alone, so every check below passes on an empty graph and stands as
# the gate a first dependency would have to pass. See docs/SUPPLY-CHAIN.md.

[graph]
all-features = true

[advisories]
# RustSec advisories: any vulnerable or unmaintained crate fails the check.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only, the ones md2html itself is offered under and their kin.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
# The list is the policy for a first dependency; today nothing uses most of it.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
