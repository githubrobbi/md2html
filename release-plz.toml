#
# release-plz: the crates.io publishing lane, dormant.
#
# `.github/workflows/release-plz.yml` runs this only when the repository
# variable `LANE_RELEASE_PLZ` is `true` and the workflow is dispatched by
# hand; today it is `false`, so nothing here runs (see
# `docs/forge/COMPONENTS.md`, `lane:release-plz`).
#
# What a release is does not come from here. The version is set in the
# root `Cargo.toml` (and must agree with `docs/capabilities.md` and the
# newest heading of `CHANGELOG.md`), the changelog is written by hand and
# rolled by `just ship`, and the tag `v<version>` is the release. Should
# the lane be switched on, release-plz only publishes what that tag says;
# it neither bumps versions nor writes the changelog.

[workspace]
git_only = false
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
release_always = false
changelog_update = false
publish = false
git_release_enable = true
git_tag_enable = true
dependencies_update = false
semver_check = false
pr_branch_prefix = "release-plz-"

# Every crate of the workspace, each with `release = false`: md2html is
# installed from the repository (`cargo install --git`), not from
# crates.io, and the others are its build tooling. A crate added to the
# workspace gets its block here too (`AGENTS.md`, section 7).

[[package]]
name = "md2html"
release = false

[[package]]
name = "md2html-version"
release = false

[[package]]
name = "md2html-ci-pipeline"
release = false

[[package]]
name = "md2html-gen-hooks"
release = false

[[package]]
name = "md2html-gen-workflow"
release = false

[[package]]
name = "md2html-manifest-audit"
release = false

[[package]]
name = "md2html-dev-tools"
release = false
