# Rust Toolchain Configuration for MD2HTML Project
# This file ensures consistent toolchain usage across all environments
# and prevents issues caused by switching between stable/nightly toolchains

[toolchain]
# Pinned nightly - single source of truth for every environment.
# CI must NOT override this with `@nightly`; workflows install via
# `rustup toolchain install` (which reads this file) so the pin is always
# honored.
#
# Current pin: nightly-2026-11-23 (validated by `just toolchain-sync`:
# clippy both feature sets, Windows xwin and Linux zigbuild).  md2html
# needs nothing unstable (a CI job builds it with the Rust its
# `rust-version` names); the nightly is for rustfmt options that are not
# yet stable.  A nightly that breaks
# the build is answered by fixing the cause or keeping the pin, never by
# a workaround in the code.
#
# Run `just toolchain-sync` to re-attempt a channel bump; the CI
# pipeline auto-refreshes on `ship --fresh` unless `--skip-toolchain-sync`
# is passed.
channel = "nightly-2026-11-23"

# Only what every use needs: rustc, cargo and the host's standard library.
# No `components` and no `targets` here: rustup installs whatever this file
# lists in every job that touches the toolchain, and most CI jobs need none
# of it.  Each job adds what it uses (`rustup component add clippy`,
# `rustup target add ...`), and the gate `workflow-drift` (property 11 of
# md2html-gen-workflow) holds every workflow job to exactly that and this
# file to this shape.  A developer's machine gets the rest with the pin from
# `just toolchain-ensure` (run by `just setup`, `just go` and `just ship`):
# rustfmt, clippy, rust-src, rust-analyzer, llvm-tools, miri and the five
# targets, `toolchain_components` and `toolchain_targets` in just/shared.just.
profile = "minimal"
