# =============================================================================
# scripts/ci-pipeline/Cargo.toml - MD2HTML CI Pipeline Driver
# =============================================================================
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2025-2026 Sky, LLC.
#
# The engine behind `just go` and `just ship`: it runs `cargo`, `git` and
# `gh` as child processes, in order and in parallel, records a resumable
# ship in `build/.md2html-workflow-state.json`, and reports to the person
# running it.  It is tooling: nothing of it is linked into md2html.
#
# Lints: inherits `[lints] workspace = true` (see the bottom-of-file
# `[lints]` block) with no exception anywhere in `src/`: the text for
# people goes through `src/out.rs`, which returns write errors.
# =============================================================================

[package]
name = "md2html-ci-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MD2HTML's validation and ship pipeline (`just go`, `just ship`); not published"
# Internal workspace tooling, never published (`publish = false` comes
# from the workspace).
publish.workspace = true

# Kept for a uniform manifest shape across the workspace's crates; docs.rs
# never builds an unpublished crate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "md2html-ci-pipeline"
path = "src/main.rs"

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────────────────────
# Every dependency is aliased to `[workspace.dependencies]` in the root
# Cargo.toml so a single Cargo.lock entry serves this tool and every other
# crate.  If this crate ever needs a crate that the rest of the workspace
# does not, ADD IT TO THE ROOT Cargo.toml FIRST - we do not tolerate per-
# crate direct pins because they let different consumers drift onto
# different major versions of the same crate.

[dependencies]
md2html-version.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

# build.rs stamps the build metadata `--version` prints (git sha, commit
# date, rustc, target, profile) through `md2html_version::emit_build_env`;
# it does nothing else.
[build-dependencies]
md2html-version = { workspace = true, features = ["build"] }

# The full workspace lint stack with no exception: output goes through
# `std::io::Write` on a locked handle and a failed write is an error like
# any other, so the `print_*` lints need no exemption either.
[lints]
workspace = true
