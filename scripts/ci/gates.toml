  "--workspace",
  "--all-targets",
  "--all-features",
  "--locked",
]
tiers = ["pr-fast"]
gate_when = "code_changed"
tool = "cargo-nextest"
expected_runtime_secs = 300
ci_command = "cargo nextest run --workspace --all-features --lib --tests --profile ci --locked"
notes = """
ci_command: CI runs nextest's `ci` profile (.config/nextest.toml) over the binaries `test-build` built.

The full test suite, deferred from pre-push (too slow) to PR CI.
`pre-push` has the `smoke` subset above and `test-build` for compile
