#
# MD2HTML quality-gate manifest - single source of truth for the gate
# set enforced at pre-commit, pre-push, and PR Fast CI.
#
# The two git-hook runners are GENERATED from this file:
# `just md2html-gen-hooks` writes `scripts/hooks/_lint_pre_push.sh` and
# `just gen-fast` writes `scripts/hooks/_lint_fast.sh`; never edit them by
# hand.  `.github/workflows/pr-fast.yml` is written by hand and checked
# against this file.  Four drift gates keep every consumer honest:
#   gates-drift     scripts/ci/check_gates_drift.sh - the gate SET of every
#                   consumer matches this manifest, and the schema holds
#   hooks-drift     the pre-push runner is byte-equal to what the
#                   generator emits from this file
#   fast-drift      the same for the pre-commit runner
#   workflow-drift  pr-fast.yml's jobs, `if:` predicates, `required`
#                   aggregator and change classes agree with this file, and
#                   every workflow its pins, versions, targets and profiles
#                   (md2html-gen-workflow)
#
# Field semantics:
#   id                    the gate's name (kebab-case)
#   label                 one line for humans
#   command               the argv the hooks run
#   tiers                 pre-commit | pre-push | pr-fast | tier-2
#   gate_when             always | rust_changed | dep_changed |
#                         infra_changed | code_changed
#   tool                  the binary the gate needs.  Every gate is
#                         required: it runs whenever its class fires, and
#                         a missing tool FAILS it (the hook dumps the
#                         "command not found" and names `just
#                         install-dev-tools`).  There is no field to make
#                         a gate optional; gates-drift refuses a `hard`
#                         key.
#   bucket / order        pre-push placement: "bg" runs in parallel,
#                         "seq" runs in order and stops at the first red
#   consumer_names        per-tier name when a consumer calls it otherwise
#   ci_command            the `run:` line the gate's pr-fast job uses when
#                         it is not `command` (another runner, CI's own
#                         flags); `workflow-drift` (property 10) holds the
#                         job to it, or to `command` when there is none

[manifest]
version = 1
# The files the generator writes from this manifest (informational; the
# hooks-drift and fast-drift gates are what enforce them).
generated_files = [
  "scripts/hooks/_lint_pre_push.sh",
  "scripts/hooks/_lint_fast.sh",
]

# The change classes: one extended regular expression per class, matched
# against the changed paths.  This table is their one source: the pre-push
# hook's `*_CHANGED` lines and the pre-commit hook's `has_staged_code` are
# generated from it (`hooks-drift`, `fast-drift`), and `workflow-drift`
# refuses a `classify` job in `pr-fast.yml` whose patterns differ.  `code`
# is rust OR dep OR infra, not a pattern.  A class the tools do not know is
# refused.
[classification]
rust = '\.rs$'
dep = '^(Cargo\.toml$|.*/Cargo\.toml$|Cargo\.lock$|supply-chain/)'
infra = '^(\.github/|scripts/|\.cargo/|\.config/|just/|rust-toolchain|clippy\.toml$|rustfmt\.toml$|deny\.toml$|REUSE\.toml$|codecov\.yml$)'

# ─────────────────────────────────────────────────────────────────────
# Workflow consistency (md2html-gen-workflow properties 5-8; property 9
# is the [classification] table above)
#
# The drift validator covers pr-fast.yml structurally (properties 1-4)
# and EVERY workflow under .github/workflows for the things they share
# and drift on: action pins (one SHA per action, property 5), the
# toolchain versions below (property 6), the build-target flags below
# (property 7), and the nextest profiles they name (property 8, against
# .config/nextest.toml). Change a version or a flag HERE and the gate
# names every workflow still carrying the old one.
# ─────────────────────────────────────────────────────────────────────

[toolchain]
# `python3 -m pip install --user "ziglang==<v>"` in every zig job.
ziglang = "0.17.1"
# `cargo install --locked cargo-zigbuild@<v>` in every zig job.
cargo-zigbuild = "0.24.1"
# `cargo-vet@<v>` in every vet job that builds it (PR Fast CI's
# `cargo +stable install`), `CARGO_VET_VERSION: <v>` where a job
# downloads the release and checks its SHA-256 (ci.yml's supply-chain).
cargo-vet = "0.10.3"
# `cargo-deny@<v>` or `CARGO_DENY_VERSION: <v>` (ci.yml's supply-chain,
# the release, SHA-256 checked).
cargo-deny = "0.22.0"

# One row per build target a workflow compiles for: the RUSTFLAGS a
# matrix row or a job that names `--target <target>` must carry.
# Never `target-cpu=native` anywhere (a binary built on one runner
# would SIGILL on the next); property 7 refuses it outright.
[[target]]
target = "x86_64-pc-windows-msvc"
rustflags = "-C target-cpu=x86-64-v3"

[[target]]
target = "aarch64-apple-darwin"
rustflags = "-C target-cpu=apple-m1 -C link-arg=-Wl,-dead_strip"

[[target]]
target = "x86_64-apple-darwin"
rustflags = "-C link-arg=-Wl,-dead_strip"

[[target]]
target = "x86_64-unknown-linux-musl"
rustflags = "-C target-cpu=x86-64-v3 -C link-arg=-Wl,--gc-sections"

# ─────────────────────────────────────────────────────────────────────
# Always-on gates - fire regardless of change classification
# ─────────────────────────────────────────────────────────────────────

[[gate]]
id = "fmt"
label = "cargo fmt --check"
command = ["cargo", "fmt", "--all", "--", "--check"]
tiers = ["pre-commit", "pre-push", "pr-fast"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 1
bucket = "bg"
order = 10
consumer_names = { "pre-commit" = "fmt-check" }
notes = """
Always-on at pre-push; gated on `rust_changed` at pre-commit (which
is staged-scoped) and at pr-fast (`fmt` job's `if:` condition).
The pre-commit hook calls it `fmt-check`; pre-push and pr-fast call
it `fmt`.
"""

[[gate]]
id = "forge-stamp"
label = "forge-stamp drift"
command = ["bash", "scripts/ci/check_forge_stamp.sh"]
tiers = ["pre-commit", "pre-push"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 1
bucket = "bg"
order = 21
notes = """
docs/forge/TEMPLATE_VERSION and FORGE-STAMP.toml's template-version are
two records of the template baseline; a bump must move both together,
and a missing one fails.  Local-tier only, so pr-fast.yml needs no
change.
"""

[[gate]]
id = "file-size"
label = "file-size policy"
command = ["bash", "scripts/ci/check_file_size_policy.sh"]
tiers = ["pre-commit", "pre-push", "pr-fast"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 1
bucket = "bg"
order = 20
notes = """
Enforces the workspace's 800-line limit on every Rust file git
tracks, with no exception list: a longer file is split into a module
with children.
"""

[[gate]]
id = "anti-pattern"
label = "Anti-pattern gate (no lint exception, no lossy decoding, no discarded write)"
command = ["bash", "scripts/ci/anti_pattern_gate.sh"]
tiers = ["pre-commit", "pre-push", "pr-fast"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 1
bucket = "bg"
order = 19
notes = """
What the compiler and clippy cannot refuse: an `#[allow]` or `#[expect]`
in any form in any Rust file (the one the owner approved aside,
`clippy::float_arithmetic` in `crates/md2html/src/mermaid/geom.rs`),
lossy decoding of bytes or names in production code, a discarded write
to a stream.  The core of the no-exceptions rule
(docs/policies/lint-posture.md), so it runs at every commit, every push
and on every pull request; its own cases are gate `gate-tests`.
Always-on: it reads the tracked sources in well under a second.
"""

[[gate]]
id = "gate-tests"
label = "The shell gates' own tests (scripts/**/test_*.sh)"
command = ["bash", "scripts/ci/run_gate_tests.sh"]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 2
bucket = "bg"
order = 24
notes = """
Runs every `test_*.sh` under `scripts/`: the anti-pattern gate against a
planted violation of each of its rules (each must be refused), the
approved exception (it must pass) and a checkout with no Rust file (an
error, never a pass); and the no-bypass guard against the invocations it
must block and the prose it must let through.  A gate nobody tests can
stop checking without anyone noticing.  No test found is an error.
"""

[[gate]]
id = "shellcheck"
label = "shellcheck over every shell script and just recipe (check_shell.py)"
command = ["python3", "scripts/ci/check_shell.py"]
tiers = ["pre-commit", "pre-push", "pr-fast"]
gate_when = "always"
tool = "shellcheck"
expected_runtime_secs = 3
bucket = "bg"
order = 18
notes = """
Every shell script git tracks (`*.sh` and the `#!` sh/bash files: the
git hooks, the generated ones whole) and the body of every `just` recipe
(a `#!` recipe as one script, the lines of any other as the bash script
the justfile's shell runs them as), read by shellcheck.  Refused too: a
`# shellcheck disable=` directive anywhere, and a recipe line starting
with `-` (it goes on when it fails).  Workflows' `run:` blocks are
`actionlint`'s.  The hook templates are pieces, read in the generated
hooks.  Always-on: shell lives in `scripts/`, `just/` and the justfile,
and the check takes a few seconds.  CI pins shellcheck 0.11.0.
"""

[[gate]]
id = "actionlint"
label = "actionlint over every workflow (with shellcheck over run: blocks)"
command = ["actionlint"]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "actionlint"
expected_runtime_secs = 2
bucket = "bg"
order = 17
notes = """
The workflows under `.github/workflows`: their YAML against GitHub's
schema, expressions and their types, `needs:` and outputs, runner
labels, and the shell of every `run:` block through shellcheck.  The
security reading is the gate `zizmor`.  Always-on: a workflow change is
under `.github/`, the check takes a second or two.  CI pins actionlint
1.7.12 and shellcheck 0.11.0.
"""

[[gate]]
id = "zizmor"
label = "zizmor: the workflows' security reading"
command = ["zizmor", "--offline", "--strict-collection", "."]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "zizmor"
expected_runtime_secs = 2
bucket = "bg"
order = 16
notes = """
The workflows, composite actions and Dependabot settings under
`.github/`, read for what lets an attacker in: a token a checkout keeps,
a `${{ }}` expanded into a shell, a cache a pull request could write, a
trigger that runs with this repository's token after a fork's run
(`workflow_run`, `pull_request_target`), permissions wider than a job
uses, an action not pinned by its commit.  At its default persona, with
no configuration file and no inline ignore: every finding is fixed at
its cause (docs/policies/lint-posture.md).  `--offline` keeps it the
same everywhere (the online audits ask GitHub about each action's tags
and advisories; run them by hand with `GH_TOKEN` set and without the
flag); `--strict-collection` fails on a workflow it cannot parse instead
of skipping it.  Always-on: a workflow change is under `.github/`, the
check takes a second or two.  CI pins zizmor 1.33.1, its SHA-256
checked.
"""

[[gate]]
id = "gates-drift"
label = "Gate-manifest drift detector"
command = ["bash", "scripts/ci/check_gates_drift.sh"]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 1
bucket = "bg"
order = 25
notes = """
Self-referential gate that verifies this manifest stays in lockstep
with the gate set actually defined in `_lint_fast.sh`,
`_lint_pre_push.sh`, and `pr-fast.yml`, and that every `[[gate]]`
table carries a valid `tiers` and `gate_when` (and no `hard`).  No bypass on
any tier: drift is a "fix-me-now" signal.
"""

[[gate]]
id = "hooks-drift"
label = "Hook codegen drift detector (md2html-gen-hooks --check)"
command = [
  "cargo",
  "run",
  "-q",
  "--profile",
  "tooling",
  "--locked",
  "-p",
  "md2html-gen-hooks",
  "--",
  "--check",
]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "cargo"
expected_runtime_secs = 2
bucket = "bg"
order = 26
notes = """
Verifies that the on-disk `scripts/hooks/_lint_pre_push.sh` is byte-for-byte equal
to what `md2html-gen-hooks` would emit from the canonical
`scripts/ci/gates.toml`.  Catches the failure mode where someone
manually edits the generated hook (whose AUTO-GENERATED banner
explicitly warns "MANUAL EDITS WILL BE OVERWRITTEN") instead of
editing the manifest and regenerating via `just md2html-gen-hooks`.

Pairs with `gates-drift`: the latter ensures the manifest matches
the *gate set* of every consumer; this one ensures the generator's
emitted hook matches what the manifest would produce.
"""

[[gate]]
id = "workflow-drift"
label = "Workflow structural drift detector (md2html-gen-workflow --check)"
command = [
  "cargo",
  "run",
  "-q",
  "--profile",
  "tooling",
  "--locked",
  "-p",
  "md2html-gen-workflow",
  "--",
  "--check",
]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "cargo"
expected_runtime_secs = 2
bucket = "bg"
order = 27
notes = """
Validates ten properties of `.github/workflows/pr-fast.yml` and the other
workflows against this manifest: (1) every pr-fast-tier gate has a corresponding job, (2) each
job's `if:` predicate is at least as permissive as the LUB of its
folded gates' `gate_when` classes, (3) every gate's resolved job-id is
present in `required.needs:` AND the bash `declare -A R=(...)`
aggregator, and (4) the `required` job's `name:` is exactly
`PR Fast CI / required` (the literal string in the repo's
branch-protection rule); across every workflow (5-8) one pin per
action, the `[toolchain]` versions, the `[[target]]` flags and nextest
profiles that exist; (9) the `classify` job computes each change
class with the pattern of `[classification]`; and (10) each gate's job
runs the gate's command, or its declared `ci_command`.  Failure notification lives in
the CI watch (`.github/workflows/ci-watch.yml`), outside pr-fast.yml.

Pairs with `gates-drift` and `hooks-drift`: each detector covers a
different drift axis.  `gates-drift` ensures the manifest matches the
gate-set of every consumer; `hooks-drift` ensures the on-disk pre-push
hook matches what the generator would emit; `workflow-drift` ensures
the structural properties of the per-gate jobs in `pr-fast.yml` are
consistent with the manifest, including the rename-bookkeeping failure
mode (`required.needs:` / aggregator table).
"""

[[gate]]
id = "fast-drift"
label = "Pre-commit hook codegen drift detector (md2html-gen-hooks --target pre-commit --check)"
command = [
  "cargo",
  "run",
  "-q",
  "--profile",
  "tooling",
  "--locked",
  "-p",
  "md2html-gen-hooks",
  "--",
  "--target",
  "pre-commit",
  "--check",
]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "cargo"
expected_runtime_secs = 2
bucket = "bg"
order = 28
notes = """
Verifies that the on-disk `scripts/hooks/_lint_fast.sh` is byte-for-byte equal to
what `md2html-gen-hooks --target pre-commit` would emit from this manifest.
A manual edit to the pre-commit hook (or a manifest change without a
regen) hard-fails this gate at pre-push and CI.

Sibling of `hooks-drift` for the pre-commit tier.  Same `md2html-gen-hooks`
binary, same `--check` semantics, different `--target` (and therefore
different output-path).  Lives in the pre-push + pr-fast tiers (NOT
pre-commit) - running the pre-commit drift detector inside the
pre-commit hook itself would compile the validator on every commit
and add unwanted latency to its sub-2 s budget; pre-push is the
right place to catch the drift before it reaches the remote.
"""

[[gate]]
id = "manifest-drift"
label = "Workspace manifest-inheritance drift detector (md2html-manifest-audit --check)"
command = [
  "cargo",
  "run",
  "-q",
  "--profile",
  "tooling",
  "--locked",
  "-p",
  "md2html-manifest-audit",
  "--",
  "--check",
]
tiers = ["pre-push", "pr-fast"]
gate_when = "dep_changed"
tool = "cargo"
expected_runtime_secs = 2
bucket = "bg"
order = 29
notes = """
Encodes the workspace's manifest-inheritance invariants (AGENTS.md
prohibition 5; `scripts/ci/md2html-manifest-audit`) as machine-checkable
assertions and runs them against every member `Cargo.toml`.  Catches
the drift class a manual review misses: a new crate landing
without `[lints] workspace = true`, an accidental `edition = "..."`
override, a `[profile.*]` block sneaking into a member manifest, a
new path-dep pointing outside `[workspace.members]`, etc.

Gated on `dep_changed` (Cargo.{toml,lock} | supply-chain/) because the
audit only needs to fire when a manifest actually changes.  The audit
has one place for a deviation, `KnownExceptions` in
scripts/ci/md2html-manifest-audit/src/audit.rs, and every list in it
is empty: md2html publishes nothing, so every member inherits what the
workspace decides.  Its lists are for `lane:crates-publish`
(docs/forge/COMPONENTS.md), a crate published with its own README,
keywords and categories; switching that lane on is the owner's call.
"""

[[gate]]
id = "entities-drift"
label = "Entity-table codegen drift detector (gen_entities.py --check)"
command = ["python3", "scripts/gen_entities.py", "--check"]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "python3"
expected_runtime_secs = 1
bucket = "bg"
order = 22
notes = """
Verifies that md2html's table of HTML's named character references
(`crates/md2html/src/text/entity/names.rs` and `names/part*.rs`) is
byte-for-byte what `scripts/gen_entities.py` writes from the WHATWG's
list vendored in `scripts/entities/entities.json`, and that the list is
the recorded one (its SHA-256 is in the generator).  Catches a hand
edit of the generated table, a generator change without a regen, and a
changed list.  The table's only input is that file: Python 3.8 or
later and its standard library do the rest, the same way in every
version.

Always-on: it takes a fraction of a second, and a change to the list
alone (under `scripts/`) or to the table alone (`.rs`) must both run
it.  Regenerate with `just entities`.
"""

[[gate]]
id = "doc-references"
label = "Documents name only what exists (check_doc_references.py)"
command = ["python3", "scripts/ci/check_doc_references.py"]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "python3"
expected_runtime_secs = 1
bucket = "bg"
order = 23
notes = """
Every repository path, link, `just` recipe and gate the tracked Markdown
documents name exists, and AGENTS.md section 6 has a row for every gate
of this manifest.  A document that sends its reader to a file that was
renamed, a recipe that was never there or a gate with no fix is caught
here instead of by the reader.  What is not checked, by rule: the
documents that record the past (CHANGELOG.md, reports/, research_notes/),
patterns and placeholders, paths outside the repository, the web.

Always-on: a pure-docs change is exactly what can break it, and it takes
well under a second with Python 3.8 or later and its standard library.
"""

[[gate]]
id = "versions"
label = "The version agrees in its three places (versions.py)"
command = ["python3", "scripts/ci/versions.py"]
tiers = ["pre-push", "pr-fast"]
gate_when = "always"
tool = "python3"
expected_runtime_secs = 1
bucket = "bg"
order = 24
notes = """
md2html's version is written in three places that must agree (AGENTS.md
section 11): `[workspace.package]` in the root `Cargo.toml` (with the
workspace's path dependencies and every member in `Cargo.lock`), the
capabilities page and its sixteen translations (every `version:` line
and every `md2html X.Y.Z` they say), and `CHANGELOG.md`'s newest
released heading, in the Keep a Changelog form `just ship`'s roll reads
(`## [Unreleased]`, `## [X.Y.Z] - date`, the compare link).  The README,
docs/SUPPLY-CHAIN.md and docs/policies/release_policy.md state the
minimum Rust md2html's manifest declares.  A release made by hand or by `just ship` that misses one of
them is stopped here; `python3 scripts/ci/versions.py stamp X.Y.Z`
writes the pages.  release.yml runs the same check with `--tag` at the
commit it releases.  Its cases are tested by the gate `gate-tests`.

Always-on: a docs-only change can break it, and it takes well under a
second with Python 3.8 or later and its standard library.
"""

[[gate]]
id = "commit-subjects"
label = "Conventional Commits subject validator"
command = [
  "bash",
  "scripts/ci/check_commit_subjects.sh",
  "range",
  "{{COMMIT_RANGES}}",
]
tiers = ["pre-push"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 1
bucket = "bg"
order = 30
notes = """
Validates every non-merge commit subject in the pushed range against
the SAME Conventional Commits regex CI's
`.github/workflows/commitlint.yml` runs on the PR title.  Closes the
local-vs-remote feedback loop that used to surface scope typos like
`fix(sanitize, text)` only after the workflow had already failed
upstream.  No bypass: the server-side title check applies the same
regex.  A range git cannot resolve fails the gate.
"""

[[gate]]
id = "commit-signatures"
label = "Commit-signature validator"
command = [
  "bash",
  "scripts/ci/check_commit_signatures.sh",
  "range",
  "{{COMMIT_RANGES}}",
]
tiers = ["pre-push"]
gate_when = "always"
tool = "bash"
expected_runtime_secs = 1
bucket = "bg"
order = 31
notes = """
Verifies every commit in the pushed range (merges included) carries a
signature.  `main` is governed by a `required_signatures` ruleset
(`scripts/ci/main-ruleset.json`), so an unsigned commit passes every
other local gate yet cannot be merged - a slow, maximally-late failure
after a full CI round-trip.  This moves the catch left to ~1 s at push
time and points at the `just sign-branch` self-heal.  No bypass: an
unsigned commit bound for `main` will be rejected upstream regardless,
so skipping only defers the same failure.
"""

# ─────────────────────────────────────────────────────────────────────
# Rust-changed gates - fire when *.rs is touched
# ─────────────────────────────────────────────────────────────────────

[[gate]]
id = "lint-prod"
label = "ultra-strict production clippy (--lib --bins)"
command = ["just", "lint-prod"]
tiers = ["pre-commit", "pre-push"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 8
bucket = "seq"
order = 30
notes = """
The lint table over libraries and binaries, with `lint_flags`
(just/shared.just: the three groups again at deny, nothing lower than the
table).  NOT in pr-fast (pr-fast's `clippy` job uses `lint-ci`'s --all-targets
flag stack which subsumes lint-prod's --lib --bins).
"""

[[gate]]
id = "lint-tests"
label = "strict test clippy (--tests, unwrap allowed)"
command = ["just", "lint-tests"]
tiers = ["pre-commit", "pre-push"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 8
bucket = "seq"
order = 40
notes = """
The same table and `lint_flags` over the tests; tests may unwrap,
expect and panic because clippy.toml says so (allow-*-in-tests), not
because a flag lowers a lint.  Same not-in-pr-fast rationale.
"""

[[gate]]
id = "lint-ci"
label = "CI-mirror clippy (--all-targets -D warnings)"
command = ["just", "lint-ci"]
tiers = ["pre-commit", "pre-push", "pr-fast"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 10
bucket = "seq"
order = 20
consumer_names = { "pr-fast" = "clippy" }
ci_command = "cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings"
notes = """
ci_command: `just lint-ci` locally; CI runs the recipe's command with `--locked`.

The exact clippy flag stack `pr-fast.yml`'s `clippy` job runs.
Kept in lockstep by hand (`just/test.just::lint-ci` and the job).
"""

[[gate]]
id = "lint-ci-no-default"
label = "CI-mirror clippy --no-default-features (-D warnings)"
command = ["just", "lint-ci-no-default"]
tiers = ["pre-push", "pr-fast"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 30
bucket = "seq"
order = 25
consumer_names = { "pr-fast" = "clippy-no-default" }
ci_command = "cargo clippy --workspace --all-targets --no-default-features --locked --no-deps -- -D warnings"
notes = """
ci_command: `just lint-ci-no-default` locally; CI runs the recipe's command with `--locked`.

Feature-additivity regression guard.

`cargo clippy --workspace --no-default-features --all-targets -- -D warnings`
catches items reachable only when feature X is on, but not themselves
`#[cfg(feature = "X")]`-gated.  The existing `lint-ci` gate runs
`--all-features` which masks the dead-code + unfulfilled-`expect`
warnings these gaps emit.

Catches the classic regression class: an item only compiled under
`--no-default-features` (or a non-default feature combination) that
default-features builds never see - un-gated helpers, stale
`cfg(feature = ...)` fences, feature-gated `expect` attributes.

Mirrors `lint-ci` in flag stack and `-D warnings` strictness; differs
only in `--no-default-features` instead of `--all-features`.  Together
the two gates establish the additivity property: every `pub`/`pub(crate)`
item reachable only with feature X must compile cleanly both with
feature X off AND with all features on.

Documented in `docs/policies/dependency_policy.md`.
"""

[[gate]]
id = "rustdoc"
label = "rustdoc -D warnings"
command = [
  "env",
  "RUSTDOCFLAGS=-Dwarnings",
  "cargo",
  "doc",
  "--workspace",
  "--all-features",
  "--no-deps",
  "--locked",
  "--document-private-items",
]
tiers = ["pre-push", "pr-fast"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 1
bucket = "seq"
order = 50
consumer_names = { "pr-fast" = "docs" }
notes = """
Catches broken doc-links, unresolved `[symbol]` references, and any
intra-doc cross-reference drift.  pr-fast's `docs` job runs both
this and `doc-tests` in one step.

`--document-private-items` is REQUIRED: without it rustdoc validates
only links reachable from the public API surface, so a broken
`[`crate::path::pub_crate_item`]` (or a `//!` shortcut to a private
sibling) silently renders as dead text instead of failing.  Cross-
platform - `#[cfg(windows)]` items absent on the macOS/Linux runner
are written as code spans, not links.

INTENTIONAL: we do NOT add `-D rustdoc::private_intra_doc_links`, and
this is the desired posture - do not "harden" it in.  `-Dwarnings`
already denies the whole default warning set; that lint stays quiet
here because `--document-private-items` documents the internals, so a
`//!`/public link to a `pub(crate)` sibling is a *valid internal
cross-reference*, not a leak.  (Verified: `-Dwarnings` +
`--document-private-items` = 0 warnings; adding an explicit
`-D rustdoc::private_intra_doc_links` flips such links to errors.)
That lint guards a *published*
crate's public docs from dangling to items a downstream user cannot
see - a concern that does not apply to our internal-only doc build.
Turning it on would force valid internal `[symbol]` links down to
dead code spans (a doc regression) for zero correctness gain.  The
real failure class we care about - broken / unresolved links anywhere
- is already caught by `broken-intra-doc-links` under `-Dwarnings`.
"""

[[gate]]
id = "doc-tests"
label = "cargo test --doc"
command = [
  "env",
  "RUSTDOCFLAGS=-Dwarnings",
  "cargo",
  "test",
  "--doc",
  "--workspace",
  "--all-features",
  "--locked",
]
tiers = ["pre-push", "pr-fast"]
gate_when = "rust_changed"
tool = "cargo"
expected_runtime_secs = 14
bucket = "seq"
order = 60
consumer_names = { "pr-fast" = "docs" }
notes = """
Actually EXECUTES the `/// ```rust` blocks rustdoc only compiled.  CI catches this today, but the local
gate closes a ~30 s round-trip for broken doctests.  Bundled into
pr-fast's `docs` job alongside `rustdoc`.
"""

# ─────────────────────────────────────────────────────────────────────
# Code-changed gates (rust|dep|infra) - fire when any code class touched
