# Cross-platform gate - Windows lint via cargo-xwin
# ─────────────────────────────────────────────────────────────────────

[[gate]]
id = "lint-ci-windows"
label = "Windows xwin clippy (-D warnings)"
command = ["just", "lint-ci-windows"]
tiers = ["pre-push", "pr-fast"]
gate_when = "code_changed"
tool = "cargo-xwin"
expected_runtime_secs = 6
bucket = "seq"
order = 100
consumer_names = { "pr-fast" = "windows-lint" }
ci_command = "cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings"
notes = """
ci_command: Through cargo-xwin locally; CI runs the same clippy natively on `windows-latest`.

lane:cross-lint (docs/forge/COMPONENTS.md): cross-compiled
`cargo xwin clippy -- -D warnings` with the strict flag stack.

Hard: a machine without `cargo-xwin` fails the push with the install
command (`just install-dev-tools` installs it and the
x86_64-pc-windows-msvc target; the MSVC SDK download is ~400 MB, once).
A Windows-only lint finding caught here costs seconds; caught on the PR
it costs a CI round-trip.

pr-fast.yml's `windows-lint` job runs the equivalent strict clippy
NATIVELY on `windows-latest`.
"""

# ─────────────────────────────────────────────────────────────────────
# Cross-target and hygiene gates - hard; a missing tool fails the gate
# and the hook names `just install-dev-tools`
# ─────────────────────────────────────────────────────────────────────

[[gate]]
id = "lint-ci-linux-zig"
label = "Linux zigbuild clippy (-D warnings)"
command = ["just", "lint-ci-linux-zig"]
tiers = ["pre-push"]
gate_when = "code_changed"
tool = "cargo-zigbuild"
expected_runtime_secs = 8
bucket = "seq"
order = 101
notes = """
lane:cross-lint (docs/forge/COMPONENTS.md): the Linux leg of the
cross-target lint, cross-compiled clippy via cargo-zigbuild (zig cc
drives the C build of bundled deps).  Hard: the recipe fails with the
install command when zig or cargo-zigbuild is missing.  On an x86_64
Linux host the target IS the host, `lint-ci` already lints it, and the
recipe says so instead of cross-compiling.

Authoritative Linux coverage is pr-fast's native ubuntu jobs; this
gate is the local early-warning mirror, hence pre-push only.
"""

[[gate]]
id = "lint-ci-mac-intel"
label = "Intel macOS clippy (-D warnings)"
command = ["just", "lint-ci-mac-intel"]
tiers = ["pre-push"]
gate_when = "code_changed"
tool = "cargo"
expected_runtime_secs = 8
bucket = "seq"
order = 102
notes = """
lane:cross-lint: the fourth supported platform. Cross-compiles
x86_64-apple-darwin from an arm64 host (host clang assembles x86_64;
only the rustup target is required, and rust-toolchain.toml lists it).
A missing target fails with the `rustup target add` command.  On a
non-macOS host no Apple SDK exists, so the gate cannot run there and
says so plainly; macOS Intel coverage in CI arrives with the release
build matrix (lane:release).
"""

