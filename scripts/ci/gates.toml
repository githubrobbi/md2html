"""

[[gate]]
id = "taplo"
label = "taplo TOML format check (staged scope)"
command = ["taplo", "fmt", "--check", "{{STAGED_TOML}}"]
tiers = ["pre-commit", "pr-fast"]
gate_when = "always"
tool = "taplo"
expected_runtime_secs = 1
bucket = "bg"
order = 70
consumer_names = { "pr-fast" = "text-lint" }
