# =============================================================================
# scripts/ci/md2html-gen-hooks/Cargo.toml - the git hooks from the gate manifest
# =============================================================================
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2025-2026 Sky, LLC.
#
# Reads `scripts/ci/gates.toml`, the one list of every gate, and writes the
# two hooks that run them: `scripts/hooks/_lint_fast.sh` (pre-commit) and
# `scripts/hooks/_lint_pre_push.sh` (pre-push).  Neither hook is edited by
# hand; `--check` (gates `hooks-drift`, `fast-drift`) fails when one differs
# from what this tool would write.  It is tooling: nothing of it is linked
# into md2html.
#
# Lints: the full workspace stack, as for `scripts/ci-pipeline`.
# =============================================================================

[package]
name = "md2html-gen-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Writes md2html's git hooks from the gate manifest (scripts/ci/gates.toml); not published"
# Internal workspace tooling, never published (`publish = false` comes
# from the workspace).
publish.workspace = true

# Kept for a uniform manifest shape across the workspace's crates; docs.rs
# never builds an unpublished crate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "md2html-gen-hooks"
path = "src/main.rs"

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────────────────────
# Every dependency is aliased to `[workspace.dependencies]` in the root
# Cargo.toml so a single Cargo.lock entry serves this tool and every other
# crate.  See `scripts/ci-pipeline/Cargo.toml` for the rationale.
[dependencies]
md2html-version.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true

# build.rs stamps the build metadata `--version` prints through
# `md2html_version::emit_build_env`; it does nothing else.
[build-dependencies]
md2html-version = { workspace = true, features = ["build"] }

# ─────────────────────────────────────────────────────────────────────────────
# Lints
# ─────────────────────────────────────────────────────────────────────────────
# Inherit the full workspace lint stack with no exception: output goes
# through `std::io::Write` on a locked handle and a failed write is an
# error like any other, so the `print_*` lints need no exemption either.
[lints]
workspace = true
