#
# md2html-gen-workflow: checks the pull-request workflow against the gate
# manifest.
#
# Reads `scripts/ci/gates.toml` and the workflows and fails when they
# disagree (gate `workflow-drift`): a gate meant for pull requests without
# its job in `pr-fast.yml`, a job whose `if:` would skip its gate, a gate
# missing from the `required` aggregate, the aggregate renamed, or pins,
# toolchain, targets and test profiles that differ between workflows.  It
# only reads; it never writes a workflow.  `src/main.rs` lists what it
# checks.  It is tooling: nothing of it is linked into md2html.

[package]
name = "md2html-gen-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Checks md2html's pull-request workflow against the gate manifest (scripts/ci/gates.toml); not published"
# Internal workspace tooling, never published (`publish = false` comes
# from the workspace).
publish.workspace = true

# Kept for a uniform manifest shape across the workspace's crates; docs.rs
# never builds an unpublished crate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "md2html-gen-workflow"
path = "src/main.rs"

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────────────────────
# Every dependency is aliased to `[workspace.dependencies]` in the root
# Cargo.toml so a single Cargo.lock entry serves this tool and every
# other crate.  See `scripts/ci-pipeline/Cargo.toml` for the rationale.
[dependencies]
md2html-version.workspace = true
anyhow.workspace = true
clap.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true

# build.rs stamps the build metadata `--version` prints through
# `md2html_version::emit_build_env`; it does nothing else.
[build-dependencies]
md2html-version = { workspace = true, features = ["build"] }

# ─────────────────────────────────────────────────────────────────────────────
# Lints
# ─────────────────────────────────────────────────────────────────────────────
# Inherit the full workspace lint stack with no exception: output goes
# through `std::io::Write` on a locked handle and a failed write is an
# error like any other, so the `print_*` lints need no exemption either.
[lints]
workspace = true
