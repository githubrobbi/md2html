#
# md2html-manifest-audit: the workspace's manifest rules, checked.
#
# Reads the root `Cargo.toml` and every member's, and fails with one line per
# finding when a member stops inheriting what the workspace decides: edition,
# metadata, dependency versions, lints, `rust-version`, publish, or declares
# policy that belongs to the root (gate `manifest-drift`).  The rules are
# listed in `src/audit.rs`.  It only reads; it never edits a manifest.  It is
# tooling: nothing of it is linked into md2html.

[package]
name = "md2html-manifest-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Checks every md2html workspace manifest against the workspace's manifest rules; not published"
# Internal workspace tooling, never published (`publish = false` comes
# from the workspace).
publish.workspace = true

# Kept for a uniform manifest shape across the workspace's crates; docs.rs
# never builds an unpublished crate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "md2html-manifest-audit"
path = "src/main.rs"

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────────────────────
# Every dependency is aliased to `[workspace.dependencies]` in the root
# Cargo.toml so a single Cargo.lock entry serves this tool and every
# other crate.  See `scripts/ci-pipeline/Cargo.toml` for the rationale.
[dependencies]
md2html-version.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true

# build.rs stamps the build metadata `--version` prints through
# `md2html_version::emit_build_env`; it does nothing else.
[build-dependencies]
md2html-version = { workspace = true, features = ["build"] }

# ─────────────────────────────────────────────────────────────────────────────
# Lints
# ─────────────────────────────────────────────────────────────────────────────
# Inherit the full workspace lint stack with no exception: output goes
# through `std::io::Write` on a locked handle and a failed write is an
# error like any other, so the `print_*` lints need no exemption either.
[lints]
workspace = true
